                                                        placeholder="Ej: 48"
                                                        value={newItem.totalFaces || ''}
                                                        onChange={(e) => setNewItem(prev => ({ ...prev, totalFaces: e.target.value }))}
                                                        className="w-full max-w-xs p-3 border border-gray-300 rounded-xl input-focus"
                                                        required={!isClienteCerrado}
                                                    />
                                                    <span className="text-gray-500 text-sm">caras</span>
                                                </div>
                                                <p className="text-xs text-gray-500 mt-1">
                                                    Cuenta todas las posiciones visibles en el anaquel (mínimo 1 fila completa)
                                                </p>
                                            </div>
                                        </>
                                    )}

                                    <PhotoCapture
                                        label="Fotos Después"
                                        onPhotoTaken={(photo) => setAfterPhotos(prev => [...prev, photo])}
                                        onRemovePhoto={(index) => setAfterPhotos(prev => prev.filter((_, i) => i !== index))}
                                        photos={afterPhotos}
                                    />

                                    <div className="flex flex-col">
                                        <label className="text-gray-700 font-semibold text-sm mb-1">
                                            Comentarios {isClienteCerrado ? '(requerido)' : '(opcional)'}
                                        </label>
                                        <textarea
                                            value={comments}
                                            onChange={(e) => setComments(e.target.value)}
                                            placeholder="Describe alguna situación (ej: producto agotado, competidor SIN STOCK, etc.)"
                                            className="w-full p-3 border border-gray-300 rounded-xl input-focus h-20 resize-none"
                                            required={isClienteCerrado}
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={loading || dataLoading}
                                        className="w-full btn-primary text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 mt-4"
                                    >
                                        <Save size={24} />
                                        {loading ? 'Guardando...' : 'Guardar Datos'}
                                    </button>
                                </>
                            )}
                        </form>
                    </div>

                    {/* Botón flotante y Modal del Planograma */}
                    {empresa?.planogramImage && (
                        <>
                            <button
                                onClick={() => setShowPlanogramModal(true)}
                                className="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-indigo-600 text-white shadow-xl flex items-center justify-center hover:bg-indigo-700 transition transform active:scale-95"
                                title="Ver Planograma"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <polyline points="21 15 16 10 5 21"/>
                                </svg>
                            </button>

                            {showPlanogramModal && (
                                <div
                                    className="fixed inset-0 z-[100] bg-black/75 flex items-center justify-center p-4"
                                    onClick={() => setShowPlanogramModal(false)}
                                >
                                    <div
                                        className="relative bg-white rounded-2xl max-w-5xl w-full max-h-[90vh] overflow-hidden shadow-2xl"
                                        onClick={e => e.stopPropagation()}
                                    >
                                        <div className="flex items-center justify-between p-4 border-b">
                                            <h3 className="text-xl font-bold text-indigo-700">
                                                Planograma - {empresa.nombre}
                                            </h3>
                                            <button
                                                onClick={() => setShowPlanogramModal(false)}
                                                className="text-3xl text-gray-600 hover:text-gray-900 leading-none"
                                            >
                                                ×
                                            </button>
                                        </div>
                                        <div className="p-4 bg-gray-100 overflow-auto max-h-[calc(90vh-120px)]">
                                            <img
                                                src={`${supabaseUrl}/storage/v1/object/public/visits_photos/${empresa.planogramImage}`}
                                                alt={`Planograma de ${empresa.nombre}`}
                                                className="w-full h-auto object-contain"
                                                onError={e => {
                                                    e.target.src = "https://via.placeholder.com/800x1200?text=Error+al+cargar+planograma";
                                                }}
                                            />
                                        </div>
                                        <div className="p-3 text-center text-sm text-gray-500 border-t">
                                            Toca fuera para cerrar
                                        </div>
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        };
        const App = () => {
            const [step, setStep] = useState(1);
            const [empresa, setEmpresa] = useState(null);
            const [promoterId, setPromoterId] = useState('');
            const [promoterName, setPromoterName] = useState('');
            const [initialState, setInitialState] = useState('');
            const [initialZone, setInitialZone] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [successMessage, setSuccessMessage] = useState(null);
            const [newItem, setNewItem] = useState({
                state: '',
                zone: '',
                trade: '',
                competitoritems: [{ id: crypto.randomUUID(), presentation: '', price: '', currency: '' }],
                myitems: [{ id: crypto.randomUUID(), presentation: '', price: '', currency: '', stock_shelf: '', stock_warehouse: '', faces_before: '', faces_after: '' }],
                totalFacesBefore: '',
                ourFacesBefore: '',
                totalFaces: ''
            });
            const handleEmpresaLogin = (empresaData) => {
                setEmpresa(empresaData);
                setStep(2);
            };
            const handlePromotorLogin = (id, name, estadoNombre, zonaNombre) => {
                setPromoterId(id);
                setPromoterName(name);
                setInitialState(estadoNombre);
                setInitialZone(zonaNombre);
                setNewItem(prev => ({ ...prev, state: estadoNombre, zone: zonaNombre }));
                setStep(3);
            };
            const handleBackToEmpresa = () => {
                setStep(1);
                setEmpresa(null);
            };
            const handleLogout = () => {
                setStep(1);
                setEmpresa(null);
                setPromoterId('');
                setPromoterName('');
                setInitialState('');
                setInitialZone('');
                setNewItem({
                    state: '',
                    zone: '',
                    trade: '',
                    competitoritems: [{ id: crypto.randomUUID(), presentation: '', price: '', currency: '' }],
                    myitems: [{ id: crypto.randomUUID(), presentation: '', price: '', currency: '', stock_shelf: '', stock_warehouse: '', faces_before: '', faces_after: '' }],
                    totalFacesBefore: '',
                    ourFacesBefore: '',
                    totalFaces: ''
                });
                setError(null);
                setSuccessMessage(null);
            };
            return (
                <ErrorBoundary>
                    <div className="font-sans antialiased">
                        {step === 1 && <EmpresaLogin onEmpresaLogin={handleEmpresaLogin} />}
                        {step === 2 && empresa && (
                            <PromotorLogin
                                empresa={empresa}
                                onPromotorLogin={handlePromotorLogin}
                                onBack={handleBackToEmpresa}
                            />
                        )}
                        {step === 3 && empresa && (
                            <DataEntryScreen
                                empresa={empresa}
                                promoterName={promoterName}
                                promoterId={promoterId}
                                initialState={initialState}
                                initialZone={initialZone}
                                newItem={newItem}
                                setNewItem={setNewItem}
                                error={error}
                                setError={setError}
                                successMessage={successMessage}
                                setSuccessMessage={setSuccessMessage}
                                loading={loading}
                                setLoading={setLoading}
                                onLogout={handleLogout}
                            />
                        )}
                    </div>
                </ErrorBoundary>
            );
        };
        try {
            const container = document.getElementById('root');
            if (container) {
                const root = createRoot(container);
                root.render(<App />);
            }
        } catch (e) {
            console.error('Error al renderizar:', e);
        }
        async function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('chispaDB', 2);
                request.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('pendientes')) {
                        db.createObjectStore('pendientes', { keyPath: 'id' });
                    }
                };
                request.onsuccess = e => resolve(e.target.result);
                request.onerror = e => reject(e.target.error);
            });
        }
    </script>
</body>
</html>
