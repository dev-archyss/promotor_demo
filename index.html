<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Captura de Precios</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="App para capturar precios de productos y competidores">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.2/dist/umd/supabase.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overscroll-behavior: none;
            background: linear-gradient(to bottom, #EEF2FF, #E5E7EB);
        }
        @media (max-width: 640px) {
            .container { padding: 0.5rem; }
            button, select, input, textarea { font-size: 1rem; min-height: 48px; }
            .btn-icon { width: 48px; height: 48px; }
        }
        button, select, input, textarea { transition: all 0.2s ease-in-out; }
        button:hover:not(:disabled) { transform: scale(1.05); }
        .card { box-shadow: 0 6px 12px rgba(0,0,0,0.15); border-radius: 1rem; }
        .input-focus:focus { outline: none; box-shadow: 0 0 8px rgba(79,70,229,0.3); border-color: #4F46E5; }
        .btn-primary { background: linear-gradient(to right, #4F46E5, #7C3AED); }
        .btn-primary:hover:not(:disabled) { background: linear-gradient(to right, #4338CA, #6D28D9); }
        .error-text { color: #dc2626; font-size: 0.75rem; margin-top: 0.25rem; }
        .dropdown-menu { max-height: 400px; overflow-y: auto; z-index: 50; }
        .linea-card {
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 1rem;
        }
        .linea-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(79,70,229,0.2); }
        .linea-card:active { transform: scale(0.97); }

        /* ── Splash de carga ── */
        #app-init {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: linear-gradient(to bottom, #EEF2FF, #E5E7EB);
            z-index: 9999;
        }
        #app-init .splash-icon { font-size: 3rem; margin-bottom: 14px; animation: pulse 1.5s infinite; }
        #app-init .splash-title { font-size: 1.1rem; font-weight: 800; color: #4F46E5; margin-bottom: 6px; }
        #app-init .splash-sub   { font-size: .8rem; color: #6b7280; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.7;transform:scale(1.06)} }
    </style>
</head>
<body>

<!-- Splash mientras se carga la config de forma segura -->
<div id="app-init">
    <div class="splash-icon">📊</div>
    <div class="splash-title">CAPTA</div>
    <div class="splash-sub">Iniciando...</div>
</div>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const { createRoot } = ReactDOM;

    // supabase se inicializa en initApp() — NUNCA hardcodeado aquí
    let supabase = null;

    const debounce = (func, wait) => {
        let timeout;
        return (...args) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => func(...args), wait);
        };
    };

    // ── Emojis por línea ──────────────────────────────────────
    const LINEA_EMOJIS = {
        'OLYMPIA': '🏅', 'SAL CELESTIAL': '🧂', 'PARMIGIANA': '🍝',
        'SAL': '🧂', 'LECHE': '🥛', 'PASTA': '🍝', 'CARAOTAS': '🫘',
    };
    const getEmoji = (nombre) => LINEA_EMOJIS[nombre?.toUpperCase()] || '📦';

    // ── Iconos SVG ────────────────────────────────────────────
    const Icon = ({ size=20, className='', children }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
             fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
             className={className}>{children}</svg>
    );
    const Plus  = ({ size }) => <Icon size={size}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
    const Minus = ({ size }) => <Icon size={size}><path d="M5 12h14"/></Icon>;
    const Save  = ({ size }) => (
        <Icon size={size}>
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
        </Icon>
    );
    const BackArrow = () => <Icon size={20}><path d="m15 18-6-6 6-6"/></Icon>;

    // ════════════════════════════════════════════════════════════
    // ErrorBoundary
    // ════════════════════════════════════════════════════════════
    class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { hasError: false, error: null }; }
        static getDerivedStateFromError(error) { return { hasError: true, error }; }
        render() {
            if (this.state.hasError) return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center">
                    <div className="text-5xl mb-4">⚠️</div>
                    <h2 className="text-xl font-bold text-red-600 mb-2">Algo salió mal</h2>
                    <p className="text-gray-600 text-sm mb-4">{this.state.error?.message}</p>
                    <button onClick={() => window.location.reload()}
                        className="btn-primary text-white px-6 py-2 rounded-xl font-semibold">Recargar</button>
                </div>
            );
            return this.props.children;
        }
    }

    // ════════════════════════════════════════════════════════════
    // STEP 1 — EmpresaLogin
    // ════════════════════════════════════════════════════════════
    const EmpresaLogin = ({ onEmpresaLogin }) => {
        const [empresaNombre, setEmpresaNombre] = useState('');
        const [claveAcceso, setClaveAcceso]     = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError]     = useState(null);

        const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true); setError(null);
            try {
                const { data, error } = await supabase
                    .from('empresas')
                    .select('id, nombre, gramaje_base_analisis, unidad_base_analisis, planogram_image')
                    .eq('nombre', empresaNombre)
                    .eq('clave_acceso', claveAcceso)
                    .single();
                if (error) setError('Empresa o clave incorrecta.');
                else onEmpresaLogin({ id: data.id, nombre: data.nombre, gramajeBase: data.gramaje_base_analisis, unidadBase: data.unidad_base_analisis, planogramImage: data.planogram_image });
            } catch { setError('Error al iniciar sesión. Verifica tu conexión.'); }
            finally { setLoading(false); }
        };

        return (
            <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-indigo-100 to-gray-100 p-4">
                <div className="w-full max-w-md bg-white card p-8">
                    <h1 className="text-2xl font-extrabold text-center text-indigo-700 mb-2">📊 Sistema de Captura</h1>
                    <p className="text-center text-gray-600 mb-6 text-sm">Acceso exclusivo para empresas registradas.</p>
                    <form onSubmit={handleLogin} className="flex flex-col gap-4">
                        <div>
                            <label className="block text-gray-700 text-sm font-semibold mb-1">Empresa</label>
                            <input type="text" placeholder="Nombre de la empresa" value={empresaNombre}
                                onChange={e => setEmpresaNombre(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-xl input-focus" required />
                        </div>
                        <div>
                            <label className="block text-gray-700 text-sm font-semibold mb-1">Clave de Acceso</label>
                            <input type="password" placeholder="Ingresa tu clave" value={claveAcceso}
                                onChange={e => setClaveAcceso(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-xl input-focus" required />
                        </div>
                        <button type="submit" disabled={loading}
                            className="w-full btn-primary text-white font-semibold py-3 rounded-xl shadow-md disabled:opacity-50">
                            {loading ? 'Verificando...' : 'Acceder'}
                        </button>
                    </form>
                    {error && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mt-4 rounded-lg text-sm">{error}</div>}
                    <div className="text-center text-gray-500 text-xs mt-6">Versión 3.0 • Multi-Línea de Producto</div>
                </div>
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // STEP 2 — PromotorLogin
    // ════════════════════════════════════════════════════════════
    const PromotorLogin = ({ empresa, onPromotorLogin, onBack }) => {
        const [promoterId, setPromoterId] = useState('');
        const [password, setPassword]     = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError]     = useState(null);

        const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true); setError(null);
            try {
                const { data: pd, error: pe } = await supabase
                    .from('web_promotores')
                    .select('promoter_id, promoter_name, estado_id, password, zona_id')
                    .eq('promoter_id', promoterId)
                    .eq('empresa_id', empresa.id)
                    .single();
                if (pe || !pd) { setError('ID de promotor no encontrado.'); setLoading(false); return; }
                if (pd.password !== password) { setError('Contraseña incorrecta.'); setLoading(false); return; }

                let estadoNombre = '';
                if (pd.estado_id) {
                    const { data: ed } = await supabase.from('web_estados').select('nombre').eq('id', pd.estado_id).single();
                    estadoNombre = ed?.nombre || '';
                }
                let zonaNombre = '';
                if (pd.zona_id) {
                    const { data: zd } = await supabase.from('web_zonas').select('nombre').eq('id', pd.zona_id).single();
                    if (zd) zonaNombre = zd.nombre.replace('Zona ', '');
                } else {
                    const zonaNumero = promoterId.replace('promotor_', '').replace(/_/g, '-');
                    const { data: zf } = await supabase.from('web_zonas').select('nombre').ilike('nombre', `%${zonaNumero}%`).single();
                    if (zf) zonaNombre = zf.nombre.replace('Zona ', '');
                }
                onPromotorLogin(pd.promoter_id, pd.promoter_name, estadoNombre, zonaNombre);
            } catch (err) {
                console.error('Error de login:', err);
                setError('Error al iniciar sesión. Verifica tus credenciales.');
            } finally { setLoading(false); }
        };

        return (
            <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-indigo-100 to-gray-100 p-4">
                <div className="w-full max-w-md bg-white card p-8">
                    <button onClick={onBack} className="flex items-center text-indigo-600 hover:text-indigo-800 mb-4">
                        <BackArrow /><span className="ml-2">Volver</span>
                    </button>
                    <h1 className="text-xl font-bold text-indigo-700 mb-1">Empresa: {empresa.nombre}</h1>
                    <p className="text-gray-600 text-sm mb-6">Ingresa tu ID de promotor y contraseña</p>
                    <form onSubmit={handleLogin} className="flex flex-col gap-4">
                        <div>
                            <label className="block text-gray-700 text-sm font-semibold mb-1">ID de Promotor</label>
                            <input type="text" placeholder="Ej: promotor_001" value={promoterId}
                                onChange={e => setPromoterId(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-xl input-focus" required />
                        </div>
                        <div>
                            <label className="block text-gray-700 text-sm font-semibold mb-1">Contraseña</label>
                            <input type="password" placeholder="Tu contraseña" value={password}
                                onChange={e => setPassword(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-xl input-focus" required />
                        </div>
                        <button type="submit" disabled={loading}
                            className="w-full btn-primary text-white font-semibold py-3 rounded-xl shadow-md disabled:opacity-50">
                            {loading ? 'Verificando...' : 'Iniciar Sesión'}
                        </button>
                    </form>
                    {error && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mt-4 rounded-lg text-sm">{error}</div>}
                    <div className="mt-6 text-center text-gray-500 text-xs">Contacta al administrador si no tienes credenciales</div>
                </div>
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // STEP 3 — LineaSelector
    // ════════════════════════════════════════════════════════════
    const LineaSelector = ({ empresa, promoterId, promoterName, onSelectLinea, onLogout }) => {
        const [lineas, setLineas]   = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError]     = useState(null);

        useEffect(() => {
            const fetchLineas = async () => {
                setLoading(true); setError(null);
                try {
                    // Buscar asignaciones del promotor
                    const { data: asig, error: asigErr } = await supabase
                        .from('web_promotor_lineas')
                        .select('linea_id')
                        .eq('promoter_id', promoterId);

                    if (asigErr) throw asigErr;

                    let lineasData = [];

                    if (asig && asig.length > 0) {
                        const ids = asig.map(a => a.linea_id);
                        const { data, error: linErr } = await supabase
                            .from('web_lineas')
                            .select('id, nombre, planogram_image')
                            .eq('empresa_id', empresa.id)
                            .eq('activa', true)
                            .in('id', ids)
                            .order('nombre');
                        if (linErr) throw linErr;
                        lineasData = data || [];
                    } else {
                        const { data, error: linErr } = await supabase
                            .from('web_lineas')
                            .select('id, nombre, planogram_image')
                            .eq('empresa_id', empresa.id)
                            .eq('activa', true)
                            .order('nombre');
                        if (linErr) throw linErr;
                        lineasData = data || [];
                    }

                    setLineas(lineasData);

                    // Si solo hay 1 línea → saltar automáticamente
                    if (lineasData.length === 1) {
                        onSelectLinea(lineasData[0]);
                    }
                } catch (err) {
                    console.error('Error cargando líneas:', err);
                    setError('Error al cargar líneas de producto. Verifica tu conexión.');
                } finally { setLoading(false); }
            };
            fetchLineas();
        }, [promoterId, empresa.id]);

        return (
            <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-indigo-100 to-gray-100 p-4">
                <div className="w-full max-w-md bg-white card p-8">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-xl font-bold text-indigo-700">Hola, {promoterName} 👋</h1>
                            <p className="text-gray-500 text-sm">¿Qué línea trabajas hoy?</p>
                        </div>
                        <button onClick={onLogout} className="text-xs text-red-500 border border-red-200 px-3 py-1.5 rounded-lg">
                            Salir
                        </button>
                    </div>

                    {loading && <p className="text-center text-gray-500 py-8">Cargando líneas...</p>}
                    {error   && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 rounded-lg text-sm">{error}</div>}

                    {!loading && !error && lineas.length === 0 && (
                        <p className="text-center text-gray-500 text-sm py-6">No hay líneas activas asignadas.</p>
                    )}

                    <div className="flex flex-col gap-3">
                        {lineas.map(linea => (
                            <div key={linea.id} className="linea-card bg-gradient-to-r from-indigo-50 to-purple-50 border-2 border-indigo-100 p-4"
                                onClick={() => onSelectLinea(linea)}>
                                <div className="flex items-center gap-3">
                                    <span className="text-3xl">{getEmoji(linea.nombre)}</span>
                                    <div>
                                        <p className="font-bold text-indigo-700">{linea.nombre}</p>
                                        <p className="text-xs text-gray-500">Toca para iniciar captura</p>
                                    </div>
                                    <span className="ml-auto text-indigo-400">→</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // PhotoCapture
    // ════════════════════════════════════════════════════════════
    const PhotoCapture = ({ label, onPhotoTaken, onRemovePhoto, photos }) => {
        const fileInputRef = useRef(null);
        const handleCapture = (e) => {
            const files = e.target.files;
            if (!files) return;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onloadend = () => onPhotoTaken(reader.result);
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        };
        return (
            <div className="p-4 border-2 border-dashed border-indigo-200 rounded-xl bg-indigo-50">
                <label className="block text-gray-700 font-semibold text-sm mb-2">{label}</label>
                <input ref={fileInputRef} type="file" accept="image/*" capture="environment"
                    multiple onChange={handleCapture} className="hidden" />
                <button type="button" onClick={() => fileInputRef.current?.click()}
                    className="w-full btn-primary text-white font-semibold py-2.5 rounded-xl text-sm">
                    📷 Tomar / Seleccionar Foto
                </button>
                {photos.length > 0 && (
                    <div className="mt-3">
                        <p className="text-xs text-gray-500 mb-2">{photos.length} foto{photos.length!==1?'s':''} seleccionada{photos.length!==1?'s':''}</p>
                        <div className="flex flex-wrap gap-3">
                            {photos.map((photo, i) => (
                                <div key={i} className="relative">
                                    <img src={photo} alt={`Foto ${i+1}`} className="w-24 h-24 object-cover rounded-lg border border-gray-300 shadow-sm" />
                                    <button onClick={() => onRemovePhoto(i)}
                                        className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-7 h-7 flex items-center justify-center text-sm shadow-md hover:bg-red-600">✕</button>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // ClienteAutocomplete
    // ════════════════════════════════════════════════════════════
    const ClienteAutocomplete = ({ value, onChange, empresaId }) => {
        const [query, setQuery]       = useState(value || '');
        const [results, setResults]   = useState([]);
        const [show, setShow]         = useState(false);
        const [loading, setLoading]   = useState(false);
        const wrapRef = useRef(null);

        const search = useRef(debounce(async (q) => {
            if (!q.trim() || q.length < 2) { setResults([]); setShow(false); return; }
            setLoading(true);
            try {
                const { data } = await supabase.from('web_clientes')
                    .select('id, trade_name, city')
                    .eq('empresa_id', empresaId)
                    .ilike('trade_name', `%${q}%`)
                    .order('trade_name')
                    .limit(10);
                setResults(data || []);
                setShow(true);
            } catch(e) { console.error(e); }
            finally { setLoading(false); }
        }, 350)).current;

        useEffect(() => {
            const handler = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setShow(false); };
            document.addEventListener('mousedown', handler);
            return () => document.removeEventListener('mousedown', handler);
        }, []);

        return (
            <div ref={wrapRef} className="relative">
                <input type="text" value={query}
                    placeholder="Buscar comercio..."
                    onChange={e => { setQuery(e.target.value); search(e.target.value); }}
                    onFocus={() => { if (results.length > 0) setShow(true); }}
                    className="w-full p-3 border border-gray-300 rounded-xl input-focus" />
                {loading && <span className="absolute right-3 top-3 text-xs text-gray-400">Buscando...</span>}
                {show && results.length > 0 && (
                    <div className="absolute z-50 w-full bg-white border border-gray-200 rounded-xl shadow-xl mt-1 dropdown-menu">
                        {results.map(c => (
                            <div key={c.id} className="px-4 py-3 hover:bg-indigo-50 cursor-pointer text-sm border-b border-gray-100 last:border-0"
                                onMouseDown={() => { setQuery(c.trade_name); onChange(c.trade_name); setShow(false); }}>
                                <span className="font-medium">{c.trade_name}</span>
                                {c.city && <span className="text-gray-400 text-xs ml-2">· {c.city}</span>}
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // TopSellers
    // ════════════════════════════════════════════════════════════
    const TopSellers = ({ empresaId, lineaId }) => {
        const [topSellers, setTopSellers] = useState([]);
        const [loading, setLoading]       = useState(true);

        useEffect(() => {
            const fetchTop = async () => {
                setLoading(true);
                try {
                    const today = new Date(); today.setHours(0,0,0,0);
                    let q = supabase.from('web_precios').select('promoter_name')
                        .eq('empresa_id', empresaId).gte('created_at', today.toISOString());
                    if (lineaId) q = q.eq('linea_id', lineaId);
                    const { data, error } = await q;
                    if (error) throw error;
                    const counts = data.reduce((acc, i) => { acc[i.promoter_name] = (acc[i.promoter_name]||0)+1; return acc; }, {});
                    setTopSellers(Object.entries(counts).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count).slice(0,5));
                } catch(e) { console.error(e); }
                finally { setLoading(false); }
            };
            fetchTop();
        }, [empresaId, lineaId]);

        return (
            <div className="bg-white card p-5 mb-6 shadow-md">
                <h3 className="text-lg font-bold text-indigo-700 mb-4 text-center">🔥 Top 5 del Día</h3>
                {loading ? <p className="text-gray-500 text-sm text-center">Cargando ranking...</p>
                : topSellers.length > 0 ? (
                    <ol className="space-y-3">
                        {topSellers.map((s, i) => {
                            const medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
                            return (
                                <li key={i} className="flex justify-between items-center bg-indigo-50 p-3 rounded-xl">
                                    <span className="font-semibold text-gray-800">{medal} {i+1}. {s.name}</span>
                                    <span className="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full">{s.count} visitas</span>
                                </li>
                            );
                        })}
                    </ol>
                ) : <p className="text-gray-500 text-sm text-center">Sin visitas hoy todavía.</p>}
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // UserRank
    // ════════════════════════════════════════════════════════════
    const UserRank = ({ promoterName, empresaId, lineaId }) => {
        const [rank, setRank]     = useState(null);
        const [total, setTotal]   = useState(0);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            const fetchRank = async () => {
                setLoading(true);
                try {
                    const today = new Date(); today.setHours(0,0,0,0);
                    let q = supabase.from('web_precios').select('promoter_name')
                        .eq('empresa_id', empresaId).gte('created_at', today.toISOString());
                    if (lineaId) q = q.eq('linea_id', lineaId);
                    const { data, error } = await q;
                    if (error) throw error;
                    const counts = data.reduce((acc, i) => { acc[i.promoter_name] = (acc[i.promoter_name]||0)+1; return acc; }, {});
                    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
                    const idx = sorted.findIndex(([name])=>name===promoterName);
                    setRank(idx >= 0 ? idx+1 : null);
                    setTotal(sorted.length);
                } catch(e) { console.error(e); }
                finally { setLoading(false); }
            };
            fetchRank();
        }, [promoterName, empresaId, lineaId]);

        return (
            <div className="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-lg mb-6 border border-blue-100">
                <h3 className="text-sm font-bold text-blue-700 mb-2">📊 Tu Posición Nacional</h3>
                {loading ? <p className="text-gray-500 text-sm">Cargando tu ranking...</p>
                : rank ? (
                    <p className="text-gray-700 text-sm">
                        Hoy estás en el puesto <span className="font-bold text-blue-600">#{rank}</span> de <strong>{total}</strong> promotores.
                        {rank===1 && " 🏆 ¡Eres el líder del día!"}
                    </p>
                ) : <p className="text-gray-500 text-sm">Aún no tienes visitas hoy. ¡Haz tu primera captura para entrar al ranking!</p>}
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // ItemRow
    // ════════════════════════════════════════════════════════════
    const ItemRow = ({ item, type, onChange, onRemove, presentations, currencies, canRemove, errors, setErrors, onToggleOutOfStock, isOutOfStock }) => {
        const handleChange = (e) => {
            const { name, value } = e.target;
            onChange({ target: { value } }, type, item.id, name);
            if (errors[item.id]) setErrors(prev => { const n={...prev}; delete n[item.id]; return n; });
        };
        const disabled = item.presentation === 'SIN STOCK';

        return (
            <div className="flex flex-col sm:flex-row flex-wrap gap-2 mb-2 p-2 bg-gray-50 rounded-lg card">
                <select value={item.presentation} onChange={e => onChange(e, type, item.id, 'presentation')}
                    className="w-full sm:w-40 p-3 border border-gray-300 rounded-xl input-focus" required>
                    <option value="">-- Presentación --</option>
                    {presentations.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
                <input type="number" name="price" placeholder="Precio por Unidad" value={item.price}
                    onChange={handleChange} disabled={disabled}
                    className={`w-full sm:w-32 p-3 border rounded-xl input-focus ${errors[item.id]?'border-red-500':'border-gray-300'} ${disabled?'bg-gray-200 cursor-not-allowed':''}`}
                    required={!disabled} />
                <select value={item.currency} onChange={e => onChange(e, type, item.id, 'currency')}
                    disabled={disabled}
                    className={`w-full sm:w-28 p-3 border border-gray-300 rounded-xl input-focus ${disabled?'bg-gray-200 cursor-not-allowed':''}`}>
                    {currencies.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                {type === 'my' && (
                    <>
                        <input type="number" name="stock_shelf" placeholder="Stock Anaquel" value={item.stock_shelf}
                            onChange={handleChange} disabled={disabled}
                            className={`w-full sm:w-28 p-3 border border-gray-300 rounded-xl input-focus ${disabled?'bg-gray-200 cursor-not-allowed':''}`} />
                        <input type="number" name="stock_warehouse" placeholder="Stock Bodega" value={item.stock_warehouse}
                            onChange={handleChange} disabled={disabled}
                            className={`w-full sm:w-28 p-3 border border-gray-300 rounded-xl input-focus ${disabled?'bg-gray-200 cursor-not-allowed':''}`} />
                        <input type="number" name="faces_before" placeholder="Caras Antes" value={item.faces_before}
                            onChange={handleChange} disabled={disabled}
                            className={`w-full sm:w-24 p-3 border border-gray-300 rounded-xl input-focus ${disabled?'bg-gray-200 cursor-not-allowed':''}`} />
                        <input type="number" name="faces_after" placeholder="Caras Después" value={item.faces_after}
                            onChange={handleChange} disabled={disabled}
                            className={`w-full sm:w-24 p-3 border border-gray-300 rounded-xl input-focus ${disabled?'bg-gray-200 cursor-not-allowed':''}`} />
                        <button type="button" onClick={() => onToggleOutOfStock(item.id)}
                            className={`w-full sm:w-auto px-3 py-2 text-xs font-semibold rounded-xl border ${isOutOfStock?'bg-red-100 border-red-300 text-red-700':'bg-gray-100 border-gray-300 text-gray-700'}`}>
                            {isOutOfStock ? '✓ SIN STOCK' : 'SIN STOCK'}
                        </button>
                    </>
                )}
                {errors[item.id] && <span className="error-text w-full">{errors[item.id]}</span>}
                {canRemove && (
                    <button type="button" onClick={() => onRemove(item.id, type)}
                        className="p-2 text-red-500 hover:text-red-700 self-center">
                        <Minus size={20} />
                    </button>
                )}
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // STEP 4 — DataEntryScreen
    // ════════════════════════════════════════════════════════════
    const DataEntryScreen = ({ empresa, promoterName, promoterId, linea, initialState, initialZone, onLogout, onChangeLinea }) => {
        const [presentationsCompetidor, setPresentationsCompetidor] = useState([]);
        const [presentationsMy, setPresentationsMy]                 = useState([]);
        const [estados, setEstados]   = useState([]);
        const [zonas, setZonas]       = useState([]);
        const [filteredZonas, setFilteredZonas] = useState([]);
        const [dataLoading, setDataLoading]     = useState(true);
        const [loading, setLoading]   = useState(false);
        const [error, setError]       = useState(null);
        const [successMessage, setSuccessMessage] = useState(null);
        const [geoError, setGeoError] = useState(null);
        const [comments, setComments] = useState('');
        const [priceErrors, setPriceErrors]   = useState({});
        const [priceWarning, setPriceWarning] = useState('');
        const [outOfStockItems, setOutOfStockItems] = useState(new Set());
        const [isMayorista, setIsMayorista]         = useState(false);
        const [isClienteCerrado, setIsClienteCerrado] = useState(false);
        const [beforePhotos, setBeforePhotos] = useState([]);
        const [afterPhotos, setAfterPhotos]   = useState([]);
        const [showPlanogramModal, setShowPlanogramModal] = useState(false);
        const [visitStarted, setVisitStarted] = useState(false);

        const FORM_STORAGE_KEY = `precio-form-v2-${empresa.id}-${promoterId}-${linea.id}`;

        const makeEmptyForm = () => ({
            state: initialState || '',
            zone:  initialZone  || '',
            trade: '',
            competitoritems: [{ id: crypto.randomUUID(), presentation: '', price: '', currency: '' }],
            myitems:         [{ id: crypto.randomUUID(), presentation: '', price: '', currency: '', stock_shelf: '', stock_warehouse: '', faces_before: '', faces_after: '' }],
            totalFacesBefore: '',
            our_faces_before_manual: '',
            totalFaces: ''
        });

        const [newItem, setNewItem] = useState(makeEmptyForm);

        // ── Restaurar borrador ────────────────────────────────
        useEffect(() => {
            try {
                const saved = localStorage.getItem(FORM_STORAGE_KEY);
                if (saved) {
                    const p = JSON.parse(saved);
                    setNewItem(p.newItem || makeEmptyForm());
                    setComments(p.comments || '');
                    setIsMayorista(!!p.isMayorista);
                    setIsClienteCerrado(!!p.isClienteCerrado);
                    setBeforePhotos(p.beforePhotos || []);
                    setAfterPhotos(p.afterPhotos || []);
                    setVisitStarted(!!p.visitStarted);
                }
            } catch(e) { console.warn('Error restaurando formulario', e); }
        }, [FORM_STORAGE_KEY]);

        // ── Guardado robusto con debounce ──────────────────────
        const formDataRef = useRef({});
        useEffect(() => {
            formDataRef.current = { newItem, comments, isMayorista, isClienteCerrado, beforePhotos, afterPhotos, visitStarted };
        }, [newItem, comments, isMayorista, isClienteCerrado, beforePhotos, afterPhotos, visitStarted]);

        const saveFormDebounced = useRef(debounce(() => {
            try { localStorage.setItem(FORM_STORAGE_KEY, JSON.stringify(formDataRef.current)); }
            catch(e) { console.warn('Error guardando', e); }
        }, 700)).current;

        useEffect(() => {
            const saveNow = () => { try { localStorage.setItem(FORM_STORAGE_KEY, JSON.stringify(formDataRef.current)); } catch{} };
            window.addEventListener('beforeunload', saveNow);
            document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden') saveNow(); });
            return () => window.removeEventListener('beforeunload', saveNow);
        }, []);

        useEffect(() => { if (promoterId) saveFormDebounced(); },
            [newItem, comments, isMayorista, isClienteCerrado, beforePhotos, afterPhotos, visitStarted]);

        // ── Cálculos de caras ─────────────────────────────────
        const ourFacesBeforeSum = useMemo(() =>
            newItem.myitems.filter(i=>i.presentation!=='SIN STOCK').reduce((s,i)=>s+(parseInt(i.faces_before)||0),0),
        [newItem.myitems]);
        const ourFacesAfterSum = useMemo(() =>
            newItem.myitems.filter(i=>i.presentation!=='SIN STOCK').reduce((s,i)=>s+(parseInt(i.faces_after)||0),0),
        [newItem.myitems]);
        const facesBeforeDifference = newItem.our_faces_before_manual
            ? parseInt(newItem.our_faces_before_manual) - ourFacesBeforeSum : null;

        // ── Carga inicial de catálogos ────────────────────────
        useEffect(() => {
            const loadData = async () => {
                setDataLoading(true);
                try {
                    const [{ data: comp }, { data: myp }, { data: est }, { data: zon }] = await Promise.all([
                        supabase.from('web_competidor').select('presentation').eq('empresa_id', empresa.id).order('presentation'),
                        supabase.from('web_myproductos').select('presentation, gramaje, unidad').eq('empresa_id', empresa.id).eq('linea_id', linea.id).order('presentation'),
                        supabase.from('web_estados').select('id, nombre').order('nombre'),
                        supabase.from('web_zonas').select('id, nombre, estado_id').order('nombre'),
                    ]);
                    setPresentationsCompetidor((comp||[]).map(p => p.presentation));
                    // Mostrar presentación con gramaje si existe
                    setPresentationsMy((myp||[]).map(p =>
                        p.gramaje ? `${p.presentation} ${p.gramaje%1===0?parseInt(p.gramaje):p.gramaje}${p.unidad||''}` : p.presentation
                    ));
                    setEstados(est || []);
                    setZonas(zon || []);
                } catch(e) {
                    console.error('Error cargando catálogos:', e);
                    setError('Error al cargar catálogos. Verifica tu conexión.');
                } finally { setDataLoading(false); }
            };
            loadData();
        }, [empresa.id, linea.id]);

        // ── Filtrar zonas por estado ──────────────────────────
        useEffect(() => {
            if (newItem.state) {
                const est = estados.find(e => e.nombre === newItem.state);
                if (est) setFilteredZonas(zonas.filter(z => z.estado_id === est.id));
                else setFilteredZonas([]);
            } else setFilteredZonas([]);
        }, [newItem.state, estados, zonas]);

        // ── Sync offline pendientes ───────────────────────────
        useEffect(() => {
            const syncPending = async () => {
                if (!navigator.onLine) return;
                const db = await openDB();
                const tx = db.transaction('pendientes','readwrite');
                const store = tx.objectStore('pendientes');
                const pending = await new Promise(res => { const r=store.getAll(); r.onsuccess=()=>res(r.result); });
                for (let item of pending) {
                    try {
                        const ub=[], ua=[];
                        for (const p of item.before_photos||[]) { const f=dataURLtoFile(p,`before_${crypto.randomUUID()}.jpg`); await supabase.storage.from('visits_photos').upload(`before/${f.name}`,f); ub.push(f.name); }
                        for (const p of item.after_photos||[])  { const f=dataURLtoFile(p,`after_${crypto.randomUUID()}.jpg`);  await supabase.storage.from('visits_photos').upload(`after/${f.name}`,f);  ua.push(f.name); }
                        item.before_photos=ub; item.after_photos=ua;
                        const { error: ie } = await supabase.from('web_precios').insert([item]);
                        if (ie) throw ie;
                        await new Promise(res => { const r=store.delete(item.id); r.onsuccess=res; });
                        setSuccessMessage('✅ Visitas pendientes sincronizadas.');
                    } catch(e) { console.error('Error sync:', e); }
                }
            };
            window.addEventListener('online', syncPending);
            syncPending();
            return () => window.removeEventListener('online', syncPending);
        }, []);

        const dataURLtoFile = (dataurl, filename) => {
            let arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]), n=bstr.length, u8arr=new Uint8Array(n);
            while(n--){u8arr[n]=bstr.charCodeAt(n);}
            return new File([u8arr], filename, {type:mime});
        };

        const currencies = isMayorista ? ['BS','$','COP'] : ['BS','$','COP'];

        const handleItemChange = (e, type, id, field) => {
            const value = e.target.value;
            setNewItem(prev => ({
                ...prev,
                [type==='competitor'?'competitoritems':'myitems']: prev[type==='competitor'?'competitoritems':'myitems'].map(item =>
                    item.id === id ? { ...item, [field]: value } : item
                )
            }));
        };

        const addItem = (type) => {
            const newRow = type === 'competitor'
                ? { id: crypto.randomUUID(), presentation: '', price: '', currency: '' }
                : { id: crypto.randomUUID(), presentation: '', price: '', currency: '', stock_shelf: '', stock_warehouse: '', faces_before: '', faces_after: '' };
            setNewItem(prev => ({
                ...prev,
                [type==='competitor'?'competitoritems':'myitems']: [...prev[type==='competitor'?'competitoritems':'myitems'], newRow]
            }));
        };

        const removeItem = (id, type) => {
            setNewItem(prev => ({
                ...prev,
                [type==='competitor'?'competitoritems':'myitems']: prev[type==='competitor'?'competitoritems':'myitems'].filter(i => i.id !== id)
            }));
        };

        const toggleOutOfStock = (id) => {
            setOutOfStockItems(prev => {
                const next = new Set(prev);
                if (next.has(id)) {
                    next.delete(id);
                    setNewItem(p => ({...p, myitems: p.myitems.map(i => i.id===id ? {...i, presentation:''} : i)}));
                } else {
                    next.add(id);
                    setNewItem(p => ({...p, myitems: p.myitems.map(i => i.id===id ? {...i, presentation:'SIN STOCK', price:'', stock_shelf:'0', stock_warehouse:'0'} : i)}));
                }
                return next;
            });
        };

        const validatePrices = () => {
            const errors = {};
            let hasError = false;
            [...newItem.competitoritems, ...newItem.myitems].forEach(item => {
                if (item.presentation === 'SIN STOCK' || !item.presentation || !item.price) return;
                const price = parseFloat(item.price);
                if (isNaN(price) || price <= 0) { errors[item.id] = 'Precio inválido'; hasError = true; return; }
                if (item.currency === 'BS') {
                    if (price < 100 || price > 2500) { errors[item.id] = 'BS: 100–2500'; hasError = true; }
                } else if (item.currency === '$') {
                    const max = isMayorista ? 70 : 10;
                    const min = isMayorista ? 0.1 : 0.01;
                    if (price < min || price > max) { errors[item.id] = `$: ${min}–${max}`; hasError = true; }
                }
            });
            setPriceErrors(errors);
            return !hasError;
        };

        const resetForm = () => {
            setNewItem(makeEmptyForm());
            setComments(''); setPriceErrors({}); setPriceWarning('');
            setOutOfStockItems(new Set()); setIsMayorista(false);
            setIsClienteCerrado(false); setBeforePhotos([]); setAfterPhotos([]);
            setVisitStarted(false);
            localStorage.removeItem(FORM_STORAGE_KEY);
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError(null); setSuccessMessage(null); setPriceWarning('');

            if (!newItem.trade) { setError('Selecciona un comercio.'); return; }
            if (afterPhotos.length === 0) { setError('Se requiere al menos una foto después.'); return; }
            if (isClienteCerrado && !comments.trim()) { setError('Agrega un comentario para cliente cerrado.'); return; }
            if (!validatePrices()) { setPriceWarning('Revisa los precios marcados en rojo.'); return; }

            setLoading(true);
            try {
                let lat = null, lon = null;
                try {
                    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 }));
                    lat = pos.coords.latitude; lon = pos.coords.longitude;
                } catch(ge) { setGeoError('Ubicación no disponible'); }

                const uploadedBefore = [], uploadedAfter = [];
                for (const p of beforePhotos) { const f=dataURLtoFile(p,`before_${crypto.randomUUID()}.jpg`); await supabase.storage.from('visits_photos').upload(`before/${f.name}`,f); uploadedBefore.push(f.name); }
                for (const p of afterPhotos)  { const f=dataURLtoFile(p,`after_${crypto.randomUUID()}.jpg`);  await supabase.storage.from('visits_photos').upload(`after/${f.name}`,f);  uploadedAfter.push(f.name); }

                const visitData = {
                    empresa_id: empresa.id, promoter_id: promoterId, promoter_name: promoterName,
                    linea_id: linea.id, linea_nombre: linea.nombre,
                    state: newItem.state, zone: newItem.zone, trade: newItem.trade,
                    competitoritems: newItem.competitoritems.filter(i=>i.presentation),
                    myitems: newItem.myitems.filter(i=>i.presentation),
                    latitude: lat, longitude: lon, comments,
                    shelf_meters: newItem.shelf_meters || null,
                    p_mayorista: isMayorista?'Si':'No', cliente_cerrado: isClienteCerrado?'Si':'No',
                    before_photos: uploadedBefore, after_photos: uploadedAfter,
                    total_faces_before: newItem.totalFacesBefore?parseInt(newItem.totalFacesBefore):null,
                    our_faces_before_manual: newItem.our_faces_before_manual?parseInt(newItem.our_faces_before_manual):null,
                    our_faces_before_counted: ourFacesBeforeSum||null,
                    total_faces: newItem.totalFaces?parseInt(newItem.totalFaces):null,
                    our_faces_after: ourFacesAfterSum||null
                };

                if (navigator.onLine) {
                    const { error: ie } = await supabase.from('web_precios').insert([visitData]);
                    if (ie) throw ie;
                    setSuccessMessage("✅ Visita guardada con éxito.");
                    resetForm();
                } else {
                    visitData.id = crypto.randomUUID();
                    const db = await openDB();
                    const tx = db.transaction('pendientes','readwrite');
                    tx.objectStore('pendientes').add(visitData);
                    setSuccessMessage("✅ Guardado offline. Se sincronizará al conectar.");
                    resetForm();
                }
            } catch(err) {
                console.error('Error al guardar:', err);
                setError(`Error al guardar: ${err.message}`);
            } finally { setLoading(false); }
        };

        const planogramImage = linea.planogram_image || empresa.planogramImage;

        return (
            <div className="min-h-screen bg-gradient-to-b from-indigo-100 to-gray-100 p-2 sm:p-4 flex flex-col items-center relative">

                {/* Header */}
                <div className="w-full max-w-4xl mb-4 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <span className="text-2xl">{getEmoji(linea.nombre)}</span>
                        <div>
                            <p className="font-extrabold text-indigo-700 text-sm leading-tight">{linea.nombre}</p>
                            <button onClick={onChangeLinea} className="text-xs text-indigo-500 hover:text-indigo-700 underline leading-tight">Cambiar línea</button>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <button onClick={() => {
                            if (!window.confirm("¿Limpiar todos los datos de esta visita?")) return;
                            localStorage.removeItem(FORM_STORAGE_KEY);
                            resetForm();
                            setSuccessMessage("✅ Formulario limpiado.");
                        }} className="text-xs px-3 py-1.5 bg-orange-100 hover:bg-orange-200 text-orange-800 rounded-lg font-medium flex items-center gap-1 shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            Limpiar
                        </button>
                        <button onClick={onLogout} className="text-xs text-red-500 hover:text-red-700 font-medium border border-red-200 px-3 py-1.5 rounded-lg">Cerrar sesión</button>
                    </div>
                </div>

                <div className="container w-full max-w-4xl bg-white card p-4 sm:p-6">
                    <div className="mb-4">
                        <span className="text-xs text-gray-400">{empresa.nombre}</span>
                        <h1 className="text-xl sm:text-2xl font-extrabold text-center text-indigo-700 mb-1">Ingreso de Precios</h1>
                        <p className="text-center text-gray-600 text-sm">
                            <span className="font-semibold text-indigo-600">{promoterName}</span>
                            {' · '}
                            <span className="font-semibold text-purple-600">{linea.nombre}</span>
                        </p>
                    </div>

                    <TopSellers empresaId={empresa.id} lineaId={linea.id} />
                    <UserRank promoterName={promoterName} empresaId={empresa.id} lineaId={linea.id} />

                    {priceWarning   && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-4 rounded-lg text-sm">{priceWarning}</div>}
                    {error          && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-4 rounded-lg text-sm">{error}</div>}
                    {successMessage && <div className="bg-green-100 border-l-4 border-green-500 text-green-700 p-3 mb-4 rounded-lg text-sm">{successMessage}</div>}
                    {geoError       && <div className="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-3 mb-4 rounded-lg text-sm">{geoError}</div>}

                    {dataLoading ? (
                        <div className="text-center py-12 text-gray-500">
                            <div className="animate-spin text-4xl mb-3">⚙️</div>
                            <p>Cargando catálogos...</p>
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} className="flex flex-col gap-6">

                            {/* Selección estado/zona/comercio */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label className="block text-gray-700 font-semibold text-sm mb-1">Estado *</label>
                                    <select value={newItem.state} onChange={e => setNewItem(p=>({...p, state:e.target.value, zone:''}))}
                                        className="w-full p-3 border border-gray-300 rounded-xl input-focus" required>
                                        <option value="">-- Estado --</option>
                                        {estados.map(e => <option key={e.id} value={e.nombre}>{e.nombre}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-semibold text-sm mb-1">Zona *</label>
                                    <select value={newItem.zone} onChange={e => setNewItem(p=>({...p, zone:e.target.value}))}
                                        className="w-full p-3 border border-gray-300 rounded-xl input-focus" required disabled={!newItem.state}>
                                        <option value="">-- Zona --</option>
                                        {filteredZonas.map(z => <option key={z.id} value={z.nombre.replace('Zona ','')}>{z.nombre}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-semibold text-sm mb-1">Comercio *</label>
                                    <ClienteAutocomplete value={newItem.trade} empresaId={empresa.id}
                                        onChange={v => setNewItem(p=>({...p, trade:v}))} />
                                </div>
                            </div>

                            {/* Fotos antes */}
                            <PhotoCapture label="📸 Fotos Antes (anaquel original)"
                                onPhotoTaken={photo => setBeforePhotos(prev=>[...prev,photo])}
                                onRemovePhoto={i => setBeforePhotos(prev=>prev.filter((_,j)=>j!==i))}
                                photos={beforePhotos} />

                            {/* Pre-visita */}
                            {!visitStarted && (
                                <div className="p-4 bg-purple-50 rounded-xl border border-purple-100">
                                    <h3 className="font-bold text-purple-700 mb-3">📊 Pre-visita (obligatorio)</h3>
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <div>
                                            <label className="block text-gray-700 text-sm font-semibold mb-1">Caras Totales Anaquel ANTES</label>
                                            <input type="number" min="0" placeholder="Ej: 48" value={newItem.totalFacesBefore||''}
                                                onChange={e=>setNewItem(p=>({...p,totalFacesBefore:e.target.value}))}
                                                className="w-full p-3 border border-gray-300 rounded-xl input-focus" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 text-sm font-semibold mb-1">Caras Nuestras ANTES (manual)</label>
                                            <input type="number" min="0" placeholder="Ej: 12" value={newItem.our_faces_before_manual||''}
                                                onChange={e=>setNewItem(p=>({...p,our_faces_before_manual:e.target.value}))}
                                                className="w-full p-3 border border-gray-300 rounded-xl input-focus" />
                                        </div>
                                    </div>
                                    {facesBeforeDifference !== null && (
                                        <p className="text-xs text-purple-600 mb-3">Diferencia con suma ítems: {facesBeforeDifference > 0 ? '+':''}{facesBeforeDifference}</p>
                                    )}
                                    <button type="button" onClick={() => setVisitStarted(true)}
                                        disabled={beforePhotos.length === 0}
                                        className="w-full btn-primary text-white font-semibold py-3 rounded-xl disabled:opacity-50">
                                        {beforePhotos.length === 0 ? '📷 Necesitas foto antes para continuar' : '▶ Continuar Visita'}
                                    </button>
                                </div>
                            )}

                            {visitStarted && (
                                <>
                                    {/* Opciones */}
                                    <div className="flex gap-6 flex-wrap">
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={isMayorista} onChange={e=>setIsMayorista(e.target.checked)}
                                                className="w-5 h-5 accent-indigo-600" />
                                            <span className="font-semibold text-gray-700">Precio Mayorista</span>
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={isClienteCerrado} onChange={e=>setIsClienteCerrado(e.target.checked)}
                                                className="w-5 h-5 accent-red-600" />
                                            <span className="font-semibold text-gray-700 text-red-600">Cliente Cerrado</span>
                                        </label>
                                    </div>

                                    {/* Precios competencia */}
                                    <div>
                                        <h3 className="text-lg font-bold text-gray-700 mb-2">Precios Competencia</h3>
                                        {newItem.competitoritems.map(item => (
                                            <ItemRow key={item.id} item={item} type="competitor"
                                                onChange={handleItemChange} onRemove={removeItem}
                                                presentations={presentationsCompetidor} currencies={currencies}
                                                canRemove={newItem.competitoritems.length > 1}
                                                errors={priceErrors} setErrors={setPriceErrors}
                                                onToggleOutOfStock={()=>{}} isOutOfStock={false} />
                                        ))}
                                        <button type="button" onClick={() => addItem('competitor')}
                                            className="flex items-center gap-1 text-indigo-600 hover:text-indigo-800 text-sm font-semibold mt-1">
                                            <Plus size={16} /> Agregar competidor
                                        </button>
                                    </div>

                                    {/* Nuestros precios */}
                                    <div>
                                        <h3 className="text-lg font-bold text-gray-700 mb-2">Nuestros Precios y Caras</h3>
                                        {newItem.myitems.map(item => (
                                            <ItemRow key={item.id} item={item} type="my"
                                                onChange={handleItemChange} onRemove={removeItem}
                                                presentations={presentationsMy} currencies={currencies}
                                                canRemove={newItem.myitems.length > 1}
                                                errors={priceErrors} setErrors={setPriceErrors}
                                                onToggleOutOfStock={toggleOutOfStock}
                                                isOutOfStock={outOfStockItems.has(item.id)} />
                                        ))}
                                        <button type="button" onClick={() => addItem('my')}
                                            className="flex items-center gap-1 text-purple-600 hover:text-purple-800 text-sm font-semibold mt-1">
                                            <Plus size={16} /> Agregar producto
                                        </button>
                                    </div>

                                    {/* Resumen caras */}
                                    <div className="p-3 bg-indigo-50 rounded-xl border border-indigo-100 text-sm text-indigo-700">
                                        <p>Caras antes (suma ítems): <strong>{ourFacesBeforeSum}</strong></p>
                                        <p>Caras después (suma ítems): <strong>{ourFacesAfterSum}</strong></p>
                                    </div>

                                    {/* Caras totales después */}
                                    <div className="p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                                        <label className="block text-gray-800 font-semibold mb-2">
                                            Caras Totales DESPUÉS (Anaquel Completo)
                                            <span className="text-indigo-600 ml-1 text-xs block font-normal">(incluye competencia + nuestros)</span>
                                        </label>
                                        <input type="number" min="0" placeholder="Ej: 48" value={newItem.totalFaces||''}
                                            onChange={e=>setNewItem(prev=>({...prev,totalFaces:e.target.value}))}
                                            className="w-full max-w-xs p-3 border border-gray-300 rounded-xl input-focus"
                                            required={!isClienteCerrado} />
                                    </div>

                                    {/* Fotos después */}
                                    <PhotoCapture label="📸 Fotos Después (anaquel final)"
                                        onPhotoTaken={photo => setAfterPhotos(prev=>[...prev,photo])}
                                        onRemovePhoto={i => setAfterPhotos(prev=>prev.filter((_,j)=>j!==i))}
                                        photos={afterPhotos} />

                                    {/* Comentarios */}
                                    <div>
                                        <label className="text-gray-700 font-semibold text-sm mb-1 block">
                                            Comentarios {isClienteCerrado?'(requerido)':'(opcional)'}
                                        </label>
                                        <textarea value={comments} onChange={e=>setComments(e.target.value)}
                                            placeholder="Describe alguna situación..."
                                            className="w-full p-3 border border-gray-300 rounded-xl input-focus h-20 resize-none"
                                            required={isClienteCerrado} />
                                    </div>

                                    {/* Botón guardar */}
                                    <button type="submit" disabled={loading||dataLoading}
                                        className="w-full btn-primary text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 disabled:opacity-50">
                                        <Save size={24} />
                                        {loading ? 'Guardando...' : 'Guardar Visita'}
                                    </button>
                                </>
                            )}

                        </form>
                    )}
                </div>

                {/* Botón planograma */}
                {planogramImage && (
                    <button onClick={() => setShowPlanogramModal(true)}
                        className="fixed bottom-6 right-6 bg-indigo-600 text-white rounded-full shadow-xl w-14 h-14 flex items-center justify-center text-2xl z-50">
                        📋
                    </button>
                )}

                {/* Modal planograma */}
                {showPlanogramModal && planogramImage && (
                    <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4"
                        onClick={() => setShowPlanogramModal(false)}>
                        <div className="relative max-w-3xl w-full" onClick={e=>e.stopPropagation()}>
                            <button onClick={() => setShowPlanogramModal(false)}
                                className="absolute -top-10 right-0 text-white text-3xl font-bold">✕</button>
                            <img src={`https://djjylikkocemrlsjxscr.supabase.co/storage/v1/object/public/visits_photos/${planogramImage}`}
                                alt="Planograma" className="w-full rounded-xl shadow-2xl" />
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════
    // App root
    // ════════════════════════════════════════════════════════════
    const App = () => {
        const [step, setStep]           = useState(1);
        const [empresa, setEmpresa]     = useState(null);
        const [promoterId, setPromoterId]     = useState('');
        const [promoterName, setPromoterName] = useState('');
        const [initialState, setInitialState] = useState('');
        const [initialZone, setInitialZone]   = useState('');
        const [lineaSeleccionada, setLineaSeleccionada] = useState(null);

        const handleEmpresaLogin  = (data) => { setEmpresa(data); setStep(2); };
        const handlePromotorLogin = (id, name, estado, zona) => { setPromoterId(id); setPromoterName(name); setInitialState(estado); setInitialZone(zona); setStep(3); };
        const handleSelectLinea   = (linea) => { setLineaSeleccionada(linea); setStep(4); };
        const handleChangeLinea   = () => { setLineaSeleccionada(null); setStep(3); };
        const handleLogout        = () => { setStep(1); setEmpresa(null); setPromoterId(''); setPromoterName(''); setInitialState(''); setInitialZone(''); setLineaSeleccionada(null); };

        return (
            <ErrorBoundary>
                <div className="font-sans antialiased">
                    {step===1 && <EmpresaLogin onEmpresaLogin={handleEmpresaLogin} />}
                    {step===2 && empresa && <PromotorLogin empresa={empresa} onPromotorLogin={handlePromotorLogin} onBack={()=>setStep(1)} />}
                    {step===3 && empresa && <LineaSelector empresa={empresa} promoterId={promoterId} promoterName={promoterName} onSelectLinea={handleSelectLinea} onLogout={handleLogout} />}
                    {step===4 && empresa && lineaSeleccionada && (
                        <DataEntryScreen empresa={empresa} promoterName={promoterName} promoterId={promoterId}
                            linea={lineaSeleccionada} initialState={initialState} initialZone={initialZone}
                            onLogout={handleLogout} onChangeLinea={handleChangeLinea} />
                    )}
                </div>
            </ErrorBoundary>
        );
    };

    // ════════════════════════════════════════════════════════════
    // IndexedDB helper
    // ════════════════════════════════════════════════════════════
    async function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('chispaDB', 2);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('pendientes')) db.createObjectStore('pendientes', { keyPath: 'id' });
            };
            req.onsuccess = e => resolve(e.target.result);
            req.onerror   = e => reject(e.target.error);
        });
    }

    // ════════════════════════════════════════════════════════════
    // initApp — carga config de forma segura y monta React
    // ════════════════════════════════════════════════════════════
    async function initApp() {
        const splash = document.getElementById('app-init');
        try {
            const res = await fetch('/api/pwa-config');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const cfg = await res.json();
            // Inicializar supabase SOLO aquí — nunca hardcodeado
            supabase = window.supabase.createClient(cfg.supabase_url, cfg.supabase_key);
        } catch (err) {
            console.error('Error cargando config:', err);
            splash.innerHTML = `
                <div style="font-size:2.5rem;margin-bottom:14px">⚠️</div>
                <div style="font-size:1rem;font-weight:800;color:#dc2626;margin-bottom:6px">Error de conexión</div>
                <div style="font-size:.8rem;color:#6b7280;margin-bottom:20px;text-align:center;max-width:280px">No se pudo iniciar la aplicación. Verifica tu conexión.</div>
                <button onclick="location.reload()" style="background:linear-gradient(to right,#4F46E5,#7C3AED);color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:.9rem;font-weight:700;cursor:pointer">
                    🔄 Reintentar
                </button>`;
            return;
        }

        // Todo OK → ocultar splash y montar React
        splash.style.transition = 'opacity .3s';
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; }, 300);

        const container = document.getElementById('root');
        if (container) createRoot(container).render(<App />);
    }

    // Arrancar cuando el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }

</script>
</body>
</html>
