<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CAPTA — Captura de Precios</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="CAPTA — Sistema profesional de captura de precios en campo">

    <!-- ⚠️ Credenciales desde config.js (NO está en git) -->
    <script src="config.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.2/dist/umd/supabase.min.js"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overscroll-behavior: none;
        }
        @media (max-width: 640px) {
            .container { padding: 0.5rem; }
            button, select, input, textarea { font-size: 1rem; min-height: 44px; }
            .btn-icon { width: 44px; height: 44px; }
        }
        button, select, input, textarea { transition: all 0.15s ease; }
        button:hover:not(:disabled) { transform: scale(1.02); }
        button:active:not(:disabled) { transform: scale(0.98); }
        .card { box-shadow: 0 2px 12px rgba(0,0,0,0.08); border-radius: 1rem; }
        .input-focus:focus { outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.18); border-color: #4F46E5; }
        .btn-primary { background: linear-gradient(135deg,#4F46E5,#7C3AED); }
        .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg,#4338CA,#6D28D9); box-shadow: 0 4px 18px rgba(79,70,229,0.35); }
        .error-text { color:#dc2626; font-size:0.75rem; margin-top:0.25rem; }
        .dropdown-menu { max-height:380px; overflow-y:auto; z-index:50; }
        .linea-card { transition: all 0.2s ease; cursor:pointer; border:2px solid transparent; border-radius:1rem; }
        .linea-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(79,70,229,0.18); }
        .linea-card:active { transform:scale(0.97); }

        /* ── CAPTA Logo ── */
        @keyframes logo-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(79,70,229,0.4); }
            60%      { box-shadow: 0 0 0 14px rgba(79,70,229,0); }
        }
        .capta-ring {
            width:80px; height:80px; border-radius:50%;
            background: linear-gradient(135deg,rgba(79,70,229,0.12),rgba(124,58,237,0.12));
            border: 2px solid rgba(79,70,229,0.2);
            display:flex; align-items:center; justify-content:center;
            animation: logo-pulse 2.8s ease-in-out infinite;
        }
        .capta-inner {
            width:58px; height:58px; border-radius:50%;
            background: linear-gradient(135deg,#4F46E5,#7C3AED);
            display:flex; align-items:center; justify-content:center;
            box-shadow: 0 6px 20px rgba(79,70,229,0.45);
        }
        .capta-wordmark {
            font-size:2.2rem; font-weight:900; letter-spacing:0.14em;
            background: linear-gradient(135deg,#4F46E5,#7C3AED);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .login-bg { background: linear-gradient(160deg,#EEF2FF 0%,#F5F3FF 50%,#EDE9FE 100%); min-height:100vh; }
        .feature-chip {
            display:inline-flex; align-items:center; gap:5px;
            background:white; border:1px solid rgba(79,70,229,0.15);
            border-radius:8px; padding:5px 10px; font-size:0.72rem;
            color:#4B5563; font-weight:500;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .section-badge {
            display:inline-flex; align-items:center; gap:6px;
            background:rgba(79,70,229,0.07); border:1px solid rgba(79,70,229,0.12);
            color:#6366F1; font-size:0.7rem; font-weight:700;
            padding:3px 10px; border-radius:999px; letter-spacing:0.05em; text-transform:uppercase;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const { createRoot } = ReactDOM;

    // ── Credenciales desde config.js (NO en git) ────────────────
    const { supabaseUrl, supabaseKey } = window.CAPTA_CONFIG;
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const debounce = (fn, ms) => {
        let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    };

    const CARD_STYLES = [
        { bg:'bg-indigo-50',  border:'border-indigo-300', title:'text-indigo-700',  badge:'bg-indigo-100 text-indigo-800'   },
        { bg:'bg-purple-50',  border:'border-purple-300', title:'text-purple-700',  badge:'bg-purple-100 text-purple-800'   },
        { bg:'bg-blue-50',    border:'border-blue-300',   title:'text-blue-700',    badge:'bg-blue-100 text-blue-800'       },
        { bg:'bg-emerald-50', border:'border-emerald-300',title:'text-emerald-700', badge:'bg-emerald-100 text-emerald-800' },
        { bg:'bg-orange-50',  border:'border-orange-300', title:'text-orange-700',  badge:'bg-orange-100 text-orange-800'  },
        { bg:'bg-rose-50',    border:'border-rose-300',   title:'text-rose-700',    badge:'bg-rose-100 text-rose-800'      },
    ];

    // ════════════════════════════════════════════════
    // ERROR BOUNDARY
    // ════════════════════════════════════════════════
    class ErrorBoundary extends React.Component {
        state = { error: null };
        static getDerivedStateFromError(e) { return { error: e.message }; }
        render() {
            if (this.state.error) return (
                <div className="flex items-center justify-center min-h-screen p-4">
                    <div className="w-full max-w-md bg-white card p-6">
                        <h2 className="text-xl font-bold text-red-600 mb-3">Error de aplicación</h2>
                        <p className="text-gray-600 text-sm">{this.state.error}</p>
                        <button onClick={()=>window.location.reload()} className="mt-4 btn-primary text-white text-sm px-4 py-2 rounded-lg">Recargar</button>
                    </div>
                </div>
            );
            return this.props.children;
        }
    }

    // ── Iconos SVG ───────────────────────────────────────────────
    const Ico = ({ d, size=24, cls="" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
             fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={cls}>
            {Array.isArray(d) ? d.map((dd,i)=><path key={i} d={dd}/>) : <path d={d}/>}
        </svg>
    );
    const IcoPlus    = ({s=24}) => <Ico size={s} d={["M5 12h14","M12 5v14"]}/>;
    const IcoMinus   = ({s=24}) => <Ico size={s} d="M5 12h14"/>;
    const IcoSave    = ({s=24}) => <Ico size={s} d={["M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z","M17 21V13H7v8","M7 3v5h8"]}/>;
    const IcoBack    = () => <Ico size={20} d="m15 18-6-6 6-6"/>;
    const IcoTrash   = () => <Ico size={14} d={["M3 6h18","M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6","M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"]}/>;
    const IcoGrid    = () => <Ico size={22} d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>;

    // ── Logo CAPTA ───────────────────────────────────────────────
    const CaptaLogo = ({ size = 'md' }) => {
        const ring = size==='lg' ? 'width:96px;height:96px' : 'width:72px;height:72px';
        const inner = size==='lg' ? 'width:68px;height:68px' : 'width:52px;height:52px';
        const iconSize = size==='lg' ? 34 : 26;
        return (
            <div className="flex flex-col items-center gap-3">
                <div className="capta-ring" style={size==='lg'?{width:'96px',height:'96px'}:{width:'72px',height:'72px'}}>
                    <div className="capta-inner" style={size==='lg'?{width:'68px',height:'68px'}:{width:'52px',height:'52px'}}>
                        {/* Ícono: clipboard con check mark — captura de datos */}
                        <svg width={iconSize} height={iconSize} viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                            <rect x="9" y="3" width="6" height="4" rx="1" ry="1"/>
                            <path d="m9 12 2 2 4-4"/>
                        </svg>
                    </div>
                </div>
                <div className="capta-wordmark" style={{fontSize: size==='lg'?'2.2rem':'1.7rem'}}>CAPTA</div>
            </div>
        );
    };

    // ════════════════════════════════════════════════
    // STEP 1 — EmpresaLogin (rediseñado con logo CAPTA)
    // ════════════════════════════════════════════════
    const EmpresaLogin = ({ onEmpresaLogin }) => {
        const [nombre, setNombre] = useState('');
        const [clave, setClave]   = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError]     = useState(null);
        const [showPass, setShowPass] = useState(false);

        const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true); setError(null);
            try {
                const { data, error } = await supabase
                    .from('empresas')
                    .select('id,nombre,gramaje_base_analisis,unidad_base_analisis,planogram_image')
                    .eq('nombre', nombre.trim())
                    .eq('clave_acceso', clave.trim())
                    .single();
                if (error) throw new Error('Empresa o clave incorrecta.');
                onEmpresaLogin({
                    id: data.id, nombre: data.nombre,
                    gramajeBase: data.gramaje_base_analisis,
                    unidadBase: data.unidad_base_analisis,
                    planogramImage: data.planogram_image
                });
            } catch(err) { setError(err.message || 'Error al conectar. Verifica tu red.'); }
            finally { setLoading(false); }
        };

        return (
            <div className="login-bg flex flex-col items-center justify-center p-4">
                <div className="w-full max-w-sm">

                    {/* Hero logo */}
                    <div className="flex flex-col items-center mb-8">
                        <CaptaLogo size="lg" />
                        <p className="text-gray-500 text-sm mt-3 text-center leading-snug">
                            Sistema de captura de precios<br/>y análisis de anaquel en campo
                        </p>
                    </div>

                    {/* Feature chips */}
                    <div className="flex flex-wrap justify-center gap-2 mb-6">
                        {[
                            ['📊','Precios en tiempo real'],
                            ['📍','Geolocalización'],
                            ['📸','Fotos de anaquel'],
                            ['📶','Funciona sin red'],
                        ].map(([ic,lb])=>(
                            <span key={lb} className="feature-chip">{ic} {lb}</span>
                        ))}
                    </div>

                    {/* Card login */}
                    <div className="bg-white card p-7 shadow-lg border border-indigo-50">
                        <div className="flex items-center gap-2 mb-5">
                            <span className="section-badge">Acceso empresarial</span>
                        </div>

                        <form onSubmit={handleLogin} className="flex flex-col gap-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-semibold mb-1.5">Empresa</label>
                                <div className="relative">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                    </span>
                                    <input type="text" placeholder="Nombre de la empresa"
                                        value={nombre} onChange={e=>setNombre(e.target.value)}
                                        className="w-full pl-9 pr-4 py-3 border border-gray-200 rounded-xl input-focus text-sm bg-gray-50" required />
                                </div>
                            </div>

                            <div>
                                <label className="block text-gray-700 text-sm font-semibold mb-1.5">Clave de acceso</label>
                                <div className="relative">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                    </span>
                                    <input type={showPass?'text':'password'} placeholder="••••••••"
                                        value={clave} onChange={e=>setClave(e.target.value)}
                                        className="w-full pl-9 pr-10 py-3 border border-gray-200 rounded-xl input-focus text-sm bg-gray-50" required />
                                    <button type="button" onClick={()=>setShowPass(!showPass)}
                                        className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1">
                                        {showPass
                                            ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                            : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        }
                                    </button>
                                </div>
                            </div>

                            <button type="submit" disabled={loading}
                                className="w-full btn-primary text-white font-semibold py-3 rounded-xl shadow-md disabled:opacity-50 flex items-center justify-center gap-2 mt-1">
                                {loading
                                    ? <><span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin inline-block"></span> Verificando...</>
                                    : '→  Ingresar al sistema'
                                }
                            </button>
                        </form>

                        {error && (
                            <div className="flex items-start gap-2 bg-red-50 border border-red-200 text-red-700 p-3 mt-4 rounded-xl text-sm">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="flex-shrink-0 mt-0.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                {error}
                            </div>
                        )}
                    </div>

                    <p className="text-center text-gray-400 text-xs mt-5">
                        CAPTA v3.1 · Powered by Sparking
                    </p>
                </div>
            </div>
        );
    };

    // ════════════════════════════════════════════════
    // STEP 2 — PromotorLogin
    // ════════════════════════════════════════════════
    const PromotorLogin = ({ empresa, onPromotorLogin, onBack }) => {
        const [promoterId, setPromoterId] = useState('');
        const [password, setPassword]     = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError]     = useState(null);
        const [showPass, setShowPass] = useState(false);

        const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true); setError(null);
            try {
                const { data: pd, error: pe } = await supabase
                    .from('web_promotores')
                    .select('promoter_id,promoter_name,estado_id,password,zona_id')
                    .eq('promoter_id', promoterId.trim())
                    .eq('empresa_id', empresa.id)
                    .single();
                if (pe || !pd) { setError('ID de promotor no encontrado.'); setLoading(false); return; }
                if (pd.password !== password) { setError('Contraseña incorrecta.'); setLoading(false); return; }

                let estadoNombre = '';
                if (pd.estado_id) {
                    const { data: ed } = await supabase.from('web_estados').select('nombre').eq('id', pd.estado_id).single();
                    estadoNombre = ed?.nombre || '';
                }
                let zonaNombre = '';
                if (pd.zona_id) {
                    const { data: zd } = await supabase.from('web_zonas').select('nombre').eq('id', pd.zona_id).single();
                    if (zd) zonaNombre = zd.nombre.replace('Zona ','');
                } else {
                    const zn = promoterId.replace('promotor_','').replace(/_/g,'-');
                    const { data: zf } = await supabase.from('web_zonas').select('nombre').ilike('nombre',`%${zn}%`).single();
                    if (zf) zonaNombre = zf.nombre.replace('Zona ','');
                }
                onPromotorLogin(pd.promoter_id, pd.promoter_name, estadoNombre, zonaNombre);
            } catch(err) {
                console.error(err);
                setError('Error al iniciar sesión. Verifica tus credenciales.');
            } finally { setLoading(false); }
        };

        return (
            <div className="login-bg flex flex-col items-center justify-center p-4">
                <div className="w-full max-w-sm">
                    <div className="flex flex-col items-center mb-7">
                        <CaptaLogo size="md" />
                    </div>
                    <div className="bg-white card p-7 shadow-lg border border-indigo-50">
                        <button onClick={onBack} className="flex items-center text-indigo-500 hover:text-indigo-700 mb-4 text-sm font-medium gap-1">
                            <IcoBack/> Cambiar empresa
                        </button>
                        <div className="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 mb-5 flex items-center gap-2">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6366F1" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                            <span className="text-indigo-700 text-sm font-semibold">{empresa.nombre}</span>
                        </div>
                        <h2 className="text-lg font-bold text-gray-800 mb-1">Login de promotor</h2>
                        <p className="text-gray-500 text-xs mb-5">Ingresa tu ID y contraseña asignados</p>
                        <form onSubmit={handleLogin} className="flex flex-col gap-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-semibold mb-1.5">ID de Promotor</label>
                                <div className="relative">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    </span>
                                    <input type="text" placeholder="Ej: promotor_001"
                                        value={promoterId} onChange={e=>setPromoterId(e.target.value)}
                                        className="w-full pl-9 pr-4 py-3 border border-gray-200 rounded-xl input-focus text-sm bg-gray-50" required />
                                </div>
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-semibold mb-1.5">Contraseña</label>
                                <div className="relative">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                    </span>
                                    <input type={showPass?'text':'password'} placeholder="••••••"
                                        value={password} onChange={e=>setPassword(e.target.value)}
                                        className="w-full pl-9 pr-10 py-3 border border-gray-200 rounded-xl input-focus text-sm bg-gray-50" required />
                                    <button type="button" onClick={()=>setShowPass(!showPass)}
                                        className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1">
                                        {showPass
                                            ? <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                            : <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        }
                                    </button>
                                </div>
                            </div>
                            <button type="submit" disabled={loading}
                                className="w-full btn-primary text-white font-semibold py-3 rounded-xl shadow-md disabled:opacity-50 flex items-center justify-center gap-2 mt-1">
                                {loading
                                    ? <><span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin inline-block"></span> Verificando...</>
                                    : '→  Iniciar sesión'
                                }
                            </button>
                        </form>
                        {error && (
                            <div className="flex items-start gap-2 bg-red-50 border border-red-200 text-red-700 p-3 mt-4 rounded-xl text-sm">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="flex-shrink-0 mt-0.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                {error}
                            </div>
                        )}
                        <p className="text-center text-gray-400 text-xs mt-5">Contacta al administrador si no tienes credenciales</p>
                    </div>
                </div>
            </div>
        );
    };

    // ════════════════════════════════════════════════
    // STEP 3 — LineaSelector
    // ════════════════════════════════════════════════
    const LineaSelector = ({ empresa, promoterId, promoterName, onSelectLinea, onLogout }) => {
        const [lineas, setLineas]   = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError]     = useState(null);

        useEffect(() => {
            const fetchLineas = async () => {
                setLoading(true); setError(null);
                try {
                    const { data: asig } = await supabase
                        .from('web_promotor_lineas')
                        .select('linea_id')
                        .eq('promoter_id', promoterId);

                    let lineasData = [];

    // ════════════════════════════════════════════════
    const ClienteAutocomplete = ({ value, onChange, empresaId, promoterId, lineaId }) => {
        const [isOpen, setIsOpen]       = useState(false);
        const [searchTerm, setSearchTerm] = useState('');
        const [clientes, setClientes]   = useState([]);
        const [loading, setLoading]     = useState(false);
        const asigRef   = useRef(null);
        const wrapRef   = useRef(null);
        const timerRef  = useRef(null);

        useEffect(() => {
            (async () => {
                try {
                    let q = supabase.from('web_promotor_clientes').select('cliente_id')
                        .eq('empresa_id',empresaId).eq('promoter_id',promoterId).eq('activa',true);
                    if (lineaId) q = q.or(`linea_id.eq.${lineaId},linea_id.is.null`);
                    const { data } = await q;
                    asigRef.current = (data&&data.length>0) ? data.map(r=>r.cliente_id) : null;
                } catch { asigRef.current = null; }
            })();
        },[empresaId,promoterId,lineaId]);

        const buscar = useCallback(async (term='') => {
            setLoading(true);
            try {
                let q = supabase.from('web_clientes').select('id,trade_name')
                    .eq('empresa_id',empresaId).ilike('trade_name',`%${term}%`).order('trade_name').limit(30);
                if (asigRef.current !== null) q = q.in('id', asigRef.current);
                const { data } = await q;
                setClientes(data||[]);
            } catch { setClientes([]); }
            finally { setLoading(false); }
        },[empresaId]);

        useEffect(()=>{
            document.addEventListener('mousedown', e=>{
                if (wrapRef.current&&!wrapRef.current.contains(e.target)) setIsOpen(false);
            });
        },[]);

        useEffect(()=>{
            clearTimeout(timerRef.current);
            timerRef.current = setTimeout(()=>buscar(searchTerm), 300);
            return ()=>clearTimeout(timerRef.current);
        },[searchTerm, buscar]);

        const tieneRest = asigRef.current !== null;

        return (
            <div className="relative" ref={wrapRef}>
                <input type="text" placeholder="Buscar comercio..." value={searchTerm}
                    onChange={e=>{setSearchTerm(e.target.value);onChange(e.target.value);setIsOpen(true);}}
                    onFocus={()=>{setIsOpen(true);if(!searchTerm)buscar('');}}
                    className="w-full p-2.5 border border-gray-200 rounded-xl input-focus text-sm bg-white" required/>
                {tieneRest && !searchTerm && (
                    <p className="text-xs text-indigo-400 mt-1">{asigRef.current?.length||0} comercio(s) asignado(s)</p>
                )}
                {isOpen && (
                    <div className="absolute z-20 w-full mt-1 bg-white border border-gray-200 rounded-xl shadow-xl dropdown-menu">
                        {loading
                            ? <div className="p-3 text-gray-400 text-sm text-center">Buscando...</div>
                            : clientes.length>0
                                ? clientes.map((c,i)=>(
                                    <div key={i} className="p-3 hover:bg-indigo-50 cursor-pointer border-b border-gray-50 last:border-0 text-sm"
                                        onClick={()=>{onChange(c.trade_name);setSearchTerm(c.trade_name);setIsOpen(false);}}>
                                        {c.trade_name}
                                    </div>
                                ))
                                : <div className="p-3 text-gray-400 text-sm text-center">
                                    {searchTerm?`Sin resultados para "${searchTerm}"`:'Escribe para buscar'}
                                  </div>
                        }
                    </div>
                )}
            </div>
        );
    };

            <div className="mb-4">

                    {photos.length>0 && <span className={`ml-auto bg-${color}-100 text-${color}-700 text-xs font-bold px-2 py-0.5 rounded-full`}>{photos.length} foto{photos.length!==1?'s':''}</span>}

                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>

    // ════════════════════════════════════════════════
    // STEP 4 — DataEntryScreen
    // ════════════════════════════════════════════════
    const DataEntryScreen = ({ empresa, promoterName, promoterId, linea, initialState, initialZone, onLogout, onChangeLinea }) => {

        const [presComp, setPresComp]     = useState([]);
        const [presMy, setPresMy]         = useState([]);
        const [estados, setEstados]       = useState([]);
        const [zonas, setZonas]           = useState([]);
        const [filtZonas, setFiltZonas]   = useState([]);
        const [dataLoading, setDataLoading] = useState(true);
        const [loading, setLoading]       = useState(false);
        const [error, setError]           = useState(null);
        const [success, setSuccess]       = useState(null);
        const [geoError, setGeoError]     = useState(null);
        const [comments, setComments]     = useState('');
        const [priceErrors, setPriceErrors] = useState({});
        const [priceWarning, setPriceWarning] = useState('');
        const [outOfStock, setOutOfStock] = useState(new Set());
        const [isMayorista, setIsMayorista]     = useState(false);
        const [isClienteCerrado, setIsClienteCerrado] = useState(false);
        const [beforePhotos, setBeforePhotos] = useState([]);
        const [afterPhotos, setAfterPhotos]   = useState([]);
        const [showPlanogram, setShowPlanogram] = useState(false);
        const [visitStarted, setVisitStarted] = useState(false);

        const STORAGE_KEY = `precio-form-v2-${empresa.id}-${promoterId}-${linea.id}`;

        const makeEmpty = () => ({
            state: initialState||'', zone: initialZone||'', trade: '',
            shelfMeters: '',  // ← metros lineales del anaquel
            competitoritems: [{ id:crypto.randomUUID(), presentation:'', price:'', currency:'' }],
            myitems:         [{ id:crypto.randomUUID(), presentation:'', price:'', currency:'', stock_shelf:'', stock_warehouse:'', faces_before:'', faces_after:'' }],
            totalFacesBefore:'', our_faces_before_manual:'', totalFaces:''
        });

        const [form, setForm] = useState(makeEmpty);

        // ── Restaurar borrador ────────────────────
        useEffect(()=>{
            try {
                const s = localStorage.getItem(STORAGE_KEY);
                if (s) {
                    const p = JSON.parse(s);
                    setForm(p.form||makeEmpty());
                    setComments(p.comments||'');
                    setIsMayorista(!!p.isMayorista);
                    setIsClienteCerrado(!!p.isClienteCerrado);
                    setBeforePhotos(p.beforePhotos||[]);
                    setAfterPhotos(p.afterPhotos||[]);
                    setVisitStarted(!!p.visitStarted);
                }
            } catch(e){ console.warn('Error restaurando', e); }
        },[STORAGE_KEY]);

        // ── Guardar borrador ──────────────────────
        const stateRef = useRef({});
        useEffect(()=>{
            stateRef.current = {form,comments,isMayorista,isClienteCerrado,beforePhotos,afterPhotos,visitStarted};
        },[form,comments,isMayorista,isClienteCerrado,beforePhotos,afterPhotos,visitStarted]);

        const saveNow = useCallback(()=>{
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stateRef.current)); } catch{}
        },[STORAGE_KEY]);

        const saveDebounced = useRef(debounce(()=>{
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stateRef.current)); } catch{}
        }, 700)).current;

        useEffect(()=>{
            window.addEventListener('beforeunload', saveNow);
            document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveNow(); });
            return ()=>window.removeEventListener('beforeunload', saveNow);
        },[saveNow]);

        useEffect(()=>{ if(promoterId) saveDebounced(); },
            [form,comments,isMayorista,isClienteCerrado,beforePhotos,afterPhotos,visitStarted]);

        // ── Cálculos caras ────────────────────────
        const facesBeforeSum = useMemo(()=>
            form.myitems.filter(i=>i.presentation!=='SIN STOCK').reduce((s,i)=>s+(parseInt(i.faces_before)||0),0)
        ,[form.myitems]);
        const facesAfterSum = useMemo(()=>
            form.myitems.filter(i=>i.presentation!=='SIN STOCK').reduce((s,i)=>s+(parseInt(i.faces_after)||0),0)
        ,[form.myitems]);

        // ── Cargar catálogos filtrados por linea ─
        useEffect(()=>{
            const load = async () => {
                setDataLoading(true);
                try {
                    // Competidor por línea → fallback legado
                    let { data: cD } = await supabase.from('web_competidor').select('presentation')
                        .eq('empresa_id',empresa.id).eq('linea_id',linea.id).order('presentation');
                    let cp = cD?.map(p=>p.presentation)||[];
                    if (!cp.length) {
                        const { data: cL } = await supabase.from('web_competidor').select('presentation')
                            .eq('empresa_id',empresa.id).is('linea_id',null).order('presentation');
                        cp = cL?.map(p=>p.presentation)||[];
                    }

                    // Mis productos — por cliente asignado o línea → fallback legado
                    let mp = [];
                    const cn = form.trade?.trim();
                    if (cn) {
                        const { data: cd } = await supabase.from('web_clientes').select('id')
                            .eq('empresa_id',empresa.id).eq('trade_name',cn).maybeSingle();
                        if (cd?.id) {
                            const { data: ad } = await supabase
                                .from('web_cliente_productos')
                                .select('web_myproductos!web_cliente_productos_producto_id_fkey(presentation)')
                                .eq('empresa_id',empresa.id).eq('cliente_id',cd.id).eq('activa',true)
                                .or(`linea_id.eq.${linea.id},linea_id.is.null`);
                            if (ad?.length) mp = ad.map(r=>r.web_myproductos?.presentation).filter(Boolean).sort();
                        }
                    }
                    if (!mp.length) {
                        const { data: mD } = await supabase.from('web_myproductos').select('presentation')
                            .eq('empresa_id',empresa.id).eq('linea_id',linea.id).order('presentation');
                        mp = mD?.map(p=>p.presentation)||[];
                    }
                    if (!mp.length) {
                        const { data: mL } = await supabase.from('web_myproductos').select('presentation')
                            .eq('empresa_id',empresa.id).is('linea_id',null).order('presentation');
                        mp = mL?.map(p=>p.presentation)||[];
                    }

                    const { data: est } = await supabase.from('web_estados').select('id,nombre').order('nombre');
                    const { data: zon } = await supabase.from('web_zonas').select('id,nombre,estado_id').order('nombre');

                    setPresComp(cp); setPresMy(mp);
                    setEstados(est||[]); setZonas(zon||[]);
                } catch(e){ setError(`Error al cargar datos: ${e.message}`); }
                finally { setDataLoading(false); }
            };
            load();
        },[empresa.id, linea.id, form.trade]);

        // ── Filtrar zonas por estado ──────────────
        useEffect(()=>{
            if (form.state) {
                const est = estados.find(e=>e.nombre===form.state);
                if (est) {
                    const fz = zonas.filter(z=>z.estado_id===est.id).map(z=>z.nombre.replace('Zona ',''));
                    setFiltZonas(fz);
                    if (form.zone && !fz.includes(form.zone)) setForm(p=>({...p,zone:''}));
                } else setFiltZonas([]);
            } else setFiltZonas([]);
        },[form.state, estados, zonas]);

        // ── Sync pendientes offline ───────────────
        useEffect(()=>{
            const sync = async () => {
                if (!navigator.onLine) return;
                try {
                    const db = await openDB();
                    const tx = db.transaction('pendientes','readwrite');
                    const store = tx.objectStore('pendientes');
                    const pending = await new Promise(res=>{ const r=store.getAll(); r.onsuccess=()=>res(r.result); });
                    for (const item of pending) {
                        try {
                            const ub=[], ua=[];
                            for (const p of item.before_photos||[]) { const f=d2f(p,`before_${crypto.randomUUID()}.jpg`); await supabase.storage.from('visits_photos').upload(`before/${f.name}`,f); ub.push(f.name); }
                            for (const p of item.after_photos||[])  { const f=d2f(p,`after_${crypto.randomUUID()}.jpg`);  await supabase.storage.from('visits_photos').upload(`after/${f.name}`,f);  ua.push(f.name); }
                            item.before_photos=ub; item.after_photos=ua;
                            const { error: ie } = await supabase.from('web_precios').insert([item]);
                            if (ie) throw ie;
                            await new Promise(res=>{ const r=store.delete(item.id); r.onsuccess=res; });
                            setSuccess('✅ Visitas pendientes sincronizadas.');
                        } catch(e){ console.error('Sync error:',e); }
                    }
                } catch(e){ console.error('openDB error:',e); }
            };
            window.addEventListener('online', sync);
            sync();
            return ()=>window.removeEventListener('online', sync);
        },[]);

        const d2f = (dataurl, filename) => {
            const arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1];
            const bstr=atob(arr[1]); let n=bstr.length; const u8=new Uint8Array(n);
            while(n--) u8[n]=bstr.charCodeAt(n);
            return new File([u8], filename, {type:mime});
        };

        const handleItemChange = (e, type, id, field) => {
            const {value} = e.target;
            setForm(prev=>({
                ...prev,
                [type]: prev[type].map(item=>{
                    if (item.id!==id) return item;
                    const u={...item,[field]:value};
                    if (field==='presentation'&&value==='SIN STOCK') {
                        u.price=''; u.currency='';
                        if(type==='myitems'){u.stock_shelf='';u.stock_warehouse='';u.faces_before='';u.faces_after='';}
                    }
                    return u;
                })
            }));
            if (field==='presentation'&&value==='SIN STOCK'&&type==='myitems')
                setOutOfStock(p=>new Set([...p,id]));
            if (priceErrors[id]) { setPriceErrors(p=>{const n={...p};delete n[id];return n;}); setPriceWarning(''); }
        };

        const addItem = type => setForm(p=>({...p,[type]:[...p[type],{id:crypto.randomUUID(),presentation:'',price:'',currency:'',stock_shelf:'',stock_warehouse:'',faces_before:'',faces_after:''}]}));
        const removeItem = (type,id) => {
            setForm(p=>({...p,[type]:p[type].filter(i=>i.id!==id)}));
            setPriceErrors(p=>{const n={...p};delete n[id];return n;});
            if(type==='myitems') setOutOfStock(p=>{const s=new Set(p);s.delete(id);return s;});
        };
        const toggleOOS = id => setOutOfStock(p=>{const s=new Set(p);s.has(id)?s.delete(id):s.add(id);return s;});

        const validatePrices = items => {
            const errs={};
            items.forEach(item=>{
                if(item.presentation==='SIN STOCK'||!item.price||!item.currency) return;
                const p=parseFloat(item.price); if(isNaN(p)) return;
                if(item.currency==='BS'&&(p<100||p>2500)) errs[item.id]='Bs: rango 100–2500.';
                else if(item.currency==='$'){
                    if(isMayorista&&(p<0.1||p>70))   errs[item.id]='$: rango $0.10–$70 (mayorista).';
                    else if(!isMayorista&&(p<0.01||p>10)) errs[item.id]='$: rango $0.01–$10.';
                }
            });
            setPriceErrors(errs);
            const ok=!Object.keys(errs).length;
            setPriceWarning(ok?'':"❌ Algunos precios están fuera del rango esperado.");
            return ok;
        };

        const resetForm = () => {
            setComments(''); setIsMayorista(false); setIsClienteCerrado(false);
            setForm(makeEmpty()); setOutOfStock(new Set());
            setBeforePhotos([]); setAfterPhotos([]);
            localStorage.removeItem(STORAGE_KEY);
            setVisitStarted(false);
        };

        const handleSave = async (e) => {
            e.preventDefault();
            setLoading(true); setError(null); setSuccess(null); setGeoError(null); setPriceWarning('');

            if (!isClienteCerrado && !validatePrices([...form.competitoritems,...form.myitems])) { setLoading(false); return; }
            if (!afterPhotos.length) { setError('Debes tomar al menos una foto "Después".'); setLoading(false); return; }

            let lat=null, lng=null;
            try {
                const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
                lat=pos.coords.latitude; lng=pos.coords.longitude;
            } catch(e){ console.warn('Geo:',e.message); setGeoError('Sin ubicación — visita podría quedar sin confirmar.'); }

            try {
                const errs=[];
                if (!form.state) errs.push('Estado');
                if (!form.zone)  errs.push('Zona');
                if (!form.trade) {
                    errs.push('Comercio');
                } else {
                    const { data: cd } = await supabase.from('web_clientes').select('trade_name')
                        .eq('trade_name',form.trade).eq('empresa_id',empresa.id).single();
                    if (cd?.trade_name!==form.trade) errs.push('Comercio (elige uno válido de la lista)');
                }
                if (errs.length) { setError(`Completa: ${errs.join(', ')}.`); setLoading(false); return; }

                let validComp=[], validMy=[];
                if (!isClienteCerrado) {
                    validComp = form.competitoritems.filter(i=>i.presentation&&(i.presentation==='SIN STOCK'||(i.price&&i.currency)));
                    validMy   = form.myitems.filter(i=>i.presentation&&(i.presentation==='SIN STOCK'||(i.price&&i.currency)));
                    if (!validComp.length&&!validMy.length) { setError('Agrega al menos un ítem completo.'); setLoading(false); return; }
                }
                if (isClienteCerrado&&!comments.trim()) { setError('Para cliente cerrado ingresa un comentario.'); setLoading(false); return; }

                // Subir fotos
                const ub=[], ua=[];
                for (const p of beforePhotos) { const fn=`before_${crypto.randomUUID()}.jpg`; const f=d2f(p,fn); const {error:e}=await supabase.storage.from('visits_photos').upload(`before/${fn}`,f,{cacheControl:'3600',upsert:false}); if(e) throw new Error(`Foto antes: ${e.message}`); ub.push(fn); }
                for (const p of afterPhotos)  { const fn=`after_${crypto.randomUUID()}.jpg`;  const f=d2f(p,fn); const {error:e}=await supabase.storage.from('visits_photos').upload(`after/${fn}`,f,{cacheControl:'3600',upsert:false});  if(e) throw new Error(`Foto después: ${e.message}`); ua.push(fn); }

                // ── Payload completo para sincronía con Dashboard ─────────────────────
                const visitData = {
                    empresa_id:       empresa.id,
                    promoter_id:      promoterId,
                    promoter_name:    promoterName,
                    linea_id:         linea.id,
                    linea_nombre:     linea.nombre,
                    state:            form.state,
                    zone:             form.zone,
                    trade:            form.trade,

                    // ← CAMPO CLAVE para metros_espacios.html del Dashboard
                    shelf_meters: form.shelfMeters ? parseFloat(form.shelfMeters) : null,

                    competitoritems: validComp.map(i=>({
                        presentation: i.presentation,
                        price:    i.presentation==='SIN STOCK'?null:parseFloat(i.price),
                        currency: i.presentation==='SIN STOCK'?null:i.currency
                    })),
                    myitems: validMy.map(i=>({
                        presentation:  i.presentation,
                        price:         i.presentation==='SIN STOCK'?null:parseFloat(i.price),
                        currency:      i.presentation==='SIN STOCK'?null:i.currency,
                        stock_shelf:   i.presentation==='SIN STOCK'?null:(outOfStock.has(i.id)?null:(i.stock_shelf!==''?parseFloat(i.stock_shelf):null)),
                        stock_warehouse: i.presentation==='SIN STOCK'?null:(outOfStock.has(i.id)?null:(i.stock_warehouse!==''?parseFloat(i.stock_warehouse):null)),
                        faces_before:  i.presentation==='SIN STOCK'?null:(i.faces_before!==''?parseInt(i.faces_before):null),
                        faces_after:   i.presentation==='SIN STOCK'?null:(i.faces_after!==''?parseInt(i.faces_after):null)
                    })),

                    latitude:  lat,
                    longitude: lng,
                    comments:  comments.trim()||null,
                    p_mayorista:     isMayorista?'Si':'No',
                    cliente_cerrado: isClienteCerrado?'Si':'No',
                    before_photos:   ub,
                    after_photos:    ua,

                    // Caras — todos los campos que usa el Dashboard
                    total_faces_before:       form.totalFacesBefore?parseInt(form.totalFacesBefore):null,
                    our_faces_before_manual:  form.our_faces_before_manual?parseInt(form.our_faces_before_manual):null,
                    our_faces_before_counted: facesBeforeSum||null,
                    total_faces:              form.totalFaces?parseInt(form.totalFaces):null,
                    our_faces_after:          facesAfterSum||null,
                };

                if (navigator.onLine) {
                    const { error: ie } = await supabase.from('web_precios').insert([visitData]);
                    if (ie) throw ie;
                    setSuccess('✅ Visita guardada con éxito.');
                    resetForm();
                } else {
                    visitData.id = crypto.randomUUID();
                    const db = await openDB();
                    const tx = db.transaction('pendientes','readwrite');
                    tx.objectStore('pendientes').add(visitData);
                    setSuccess('✅ Guardado offline — se sincronizará al conectar.');
                    resetForm();
                }
            } catch(err){
                console.error(err);
                setError(`Error al guardar: ${err.message}`);
            } finally { setLoading(false); }
        };

        const planogramImage = linea.planogram_image || empresa.planogramImage;

        return (
            <div className="min-h-screen bg-gradient-to-b from-indigo-50 to-gray-100 pb-8">

                {/* ── Topbar ── */}
                <div className="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-100 px-4 py-2.5 flex items-center justify-between shadow-sm">
                    <div className="flex items-center gap-2.5">
                        {/* Mini logo */}
                        <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center flex-shrink-0">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                                <rect x="9" y="3" width="6" height="4" rx="1"/>
                                <path d="m9 12 2 2 4-4"/>
                            </svg>
                        </div>
                        <div>
                            <p className="font-bold text-indigo-700 text-xs leading-none">{linea.nombre}</p>
                            <button onClick={onChangeLinea} className="text-[10px] text-indigo-400 hover:text-indigo-600 underline leading-none mt-0.5">
                                cambiar línea
                            </button>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-500 hidden sm:block font-medium">{promoterName}</span>
                        <button onClick={()=>{
                            if(!window.confirm('¿Limpiar todos los datos de esta visita?')) return;
                            localStorage.removeItem(STORAGE_KEY); resetForm(); setSuccess('Formulario limpiado.');
                        }} className="text-xs px-2 py-1.5 bg-orange-50 hover:bg-orange-100 text-orange-700 rounded-lg font-medium flex items-center gap-1 border border-orange-100">
                            <IcoTrash/> Limpiar
                        </button>
                        <button onClick={onLogout} className="text-xs text-red-400 hover:text-red-600 font-medium border border-red-100 hover:border-red-300 px-2 py-1.5 rounded-lg transition">
                            Salir
                        </button>
                    </div>
                </div>

                {/* ── Contenido ── */}
                <div className="max-w-2xl mx-auto px-3 sm:px-4 pt-5">

                    {/* Header visual */}
                    <div className="bg-white card border border-indigo-50 p-5 mb-4">
                        <div className="flex items-center gap-3 mb-1">
                            <div className="flex-1">
                                <p className="text-xs text-gray-400 font-medium">{empresa.nombre}</p>
                                <h1 className="text-lg font-extrabold text-gray-800">Captura de Visita</h1>
                                <p className="text-sm text-indigo-600 font-medium">{promoterName} · {linea.nombre}</p>
                            </div>
                            <div className="text-right">
                                <p className="text-xs text-gray-400">{new Date().toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}</p>
                                <span className={`text-xs font-bold px-2 py-0.5 rounded-full mt-1 inline-block ${navigator.onLine?'bg-green-100 text-green-700':'bg-orange-100 text-orange-700'}`}>
                                    {navigator.onLine?'● En línea':'◎ Sin conexión'}
                                </span>
                            </div>
                        </div>
                    </div>

                    <TopSellers empresaId={empresa.id} lineaId={linea.id}/>
                    <UserRank promoterName={promoterName} empresaId={empresa.id} lineaId={linea.id}/>

                    {/* Alertas */}
                    {priceWarning && <div className="bg-red-50 border border-red-200 text-red-700 p-3 mb-3 rounded-xl text-sm flex items-start gap-2"><span>⚠️</span>{priceWarning}</div>}
                    {error        && <div className="bg-red-50 border border-red-200 text-red-700 p-3 mb-3 rounded-xl text-sm flex items-start gap-2"><span>❌</span>{error}</div>}
                    {success      && <div className="bg-green-50 border border-green-200 text-green-700 p-3 mb-3 rounded-xl text-sm flex items-start gap-2"><span>✅</span>{success}</div>}
                    {geoError     && <div className="bg-yellow-50 border border-yellow-200 text-yellow-700 p-3 mb-3 rounded-xl text-sm flex items-start gap-2"><span>📍</span>{geoError}</div>}
                    {dataLoading  && <div className="text-center text-gray-400 text-sm py-2">Cargando catálogos...</div>}

                    <form onSubmit={handleSave} className="flex flex-col gap-4">

                        {/* ── Ubicación ── */}
                        <div className="bg-white card border border-gray-100 p-5">
                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">📍 Ubicación</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-gray-700 text-xs font-semibold mb-1">Estado</label>
                                    <select value={form.state} onChange={e=>setForm(p=>({...p,state:e.target.value}))}
                                        className="w-full p-2.5 border border-gray-200 rounded-xl input-focus text-sm bg-white" required disabled={!!initialState}>
                                        <option value="">-- Estado --</option>
                                        {estados.map(e=><option key={e.id} value={e.nombre}>{e.nombre}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-gray-700 text-xs font-semibold mb-1">Zona</label>
                                    <select value={form.zone} onChange={e=>setForm(p=>({...p,zone:e.target.value}))}
                                        className="w-full p-2.5 border border-gray-200 rounded-xl input-focus text-sm bg-white" required>
                                        <option value="">-- Zona --</option>
                                        {filtZonas.map(z=><option key={z} value={z}>{z}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="mt-3">
                                <label className="block text-gray-700 text-xs font-semibold mb-1">Comercio</label>
                                <ClienteAutocomplete value={form.trade}
                                    onChange={v=>setForm(p=>({...p,trade:v}))}
                                    empresaId={empresa.id} promoterId={promoterId} lineaId={linea.id}/>
                            </div>
                        </div>

                        {/* ── Foto ANTES ── */}
                        <div className="bg-white card border border-gray-100 p-5">
                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">📸 Fotos Antes</p>
                            <PhotoCapture label="Anaquel antes de intervenir"
                                onPhotoTaken={p=>setBeforePhotos(prev=>[...prev,p])}
                                onRemovePhoto={i=>setBeforePhotos(prev=>prev.filter((_,j)=>j!==i))}
                                photos={beforePhotos} isAfter={false}/>
                        </div>

                        {/* ── Previsita ── */}
                        {!visitStarted && (
                            <div className="bg-white card border border-indigo-100 p-5">
                                <p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-3">📊 Estado inicial del anaquel</p>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div>
                                        <label className="block text-gray-700 text-xs font-semibold mb-1">Caras totales (antes)</label>
                                        <input type="number" min="0" placeholder="Ej: 72" value={form.totalFacesBefore||''}
                                            onChange={e=>setForm(p=>({...p,totalFacesBefore:e.target.value}))}
                                            className="w-full p-2.5 border border-gray-200 rounded-xl input-focus text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 text-xs font-semibold mb-1">Nuestras caras (antes)</label>
                                        <input type="number" min="0" placeholder="Ej: 18" value={form.our_faces_before_manual||''}
                                            onChange={e=>setForm(p=>({...p,our_faces_before_manual:e.target.value}))}
                                            className="w-full p-2.5 border border-gray-200 rounded-xl input-focus text-sm"/>
                                    </div>
                                    <div>
                                        {/* ← NUEVO CAMPO — metros lineales — sincroniza con metros_espacios.html del Dashboard */}
                                        <label className="block text-gray-700 text-xs font-semibold mb-1">
                                            Metros lineales del anaquel
                                            <span className="text-indigo-400 font-normal ml-1">(m)</span>
                                        </label>
                                        <input type="number" min="0" step="0.1" placeholder="Ej: 1.80" value={form.shelfMeters||''}
                                            onChange={e=>setForm(p=>({...p,shelfMeters:e.target.value}))}
                                            className="w-full p-2.5 border border-gray-200 rounded-xl input-focus text-sm"/>
                                    </div>
                                </div>
                                <button type="button" onClick={()=>{
                                    if (!beforePhotos.length) { setError('Debes tomar al menos una foto "Antes".'); return; }
                                    setError(null); setVisitStarted(true);
                                }} className="w-full mt-4 btn-primary text-white font-semibold py-3 rounded-xl shadow-md flex items-center justify-center gap-2">
                                    Continuar con la visita →
                                </button>
                            </div>
                        )}

                        {/* ── Visita principal ── */}
                        {visitStarted && (
                            <>
                                {/* Checks mayorista / cerrado */}
                                <div className="bg-white card border border-gray-100 p-4 flex items-center gap-6">
                                    <label className="flex items-center text-sm text-gray-700 cursor-pointer gap-2">
                                        <input type="checkbox" checked={isMayorista} onChange={e=>setIsMayorista(e.target.checked)}
                                            className="h-4 w-4 text-indigo-600 border-gray-300 rounded"/>
                                        Precios mayoristas
                                    </label>
                                    <label className="flex items-center text-sm text-gray-700 cursor-pointer gap-2">
                                        <input type="checkbox" checked={isClienteCerrado} onChange={e=>setIsClienteCerrado(e.target.checked)}
                                            className="h-4 w-4 text-red-500 border-gray-300 rounded"/>
                                        Cliente cerrado
                                    </label>
                                </div>

                                {!isClienteCerrado && (
                                    <>
                                        {/* Competencia */}
                                        <div className="bg-white card border border-gray-100 p-5">
                                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">🏷️ Precios Competencia</p>
                                            {form.competitoritems.map(item=>(
                                                <ItemRow key={item.id} item={item} type="competitoritems"
                                                    onChange={handleItemChange} onRemove={removeItem}
                                                    presentations={presComp} currencies={['BS','$','Pesos']}
                                                    canRemove={form.competitoritems.length>1}
                                                    errors={priceErrors} setErrors={setPriceErrors}/>
                                            ))}
                                            <div className="flex justify-end mt-2">
                                                <button type="button" onClick={()=>addItem('competitoritems')}
                                                    className="flex items-center gap-1 text-xs text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg font-semibold transition">
                                                    <IcoPlus s={14}/> Agregar
                                                </button>
                                            </div>
                                        </div>

                                        {/* Nuestros productos */}
                                        <div className="bg-white card border border-gray-100 p-5">
                                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">✅ Nuestros Precios y Caras</p>
                                            {form.myitems.map(item=>(
                                                <ItemRow key={item.id} item={item} type="myitems"
                                                    onChange={handleItemChange} onRemove={removeItem}
                                                    presentations={presMy} currencies={['BS','$','Pesos']}
                                                    canRemove={form.myitems.length>1}
                                                    errors={priceErrors} setErrors={setPriceErrors}
                                                    onToggleOutOfStock={toggleOOS} isOutOfStock={outOfStock.has(item.id)}/>
                                            ))}
                                            <div className="flex justify-end mt-2">
                                                <button type="button" onClick={()=>addItem('myitems')}
                                                    className="flex items-center gap-1 text-xs text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg font-semibold transition">
                                                    <IcoPlus s={14}/> Agregar
                                                </button>
                                            </div>
                                            <div className="mt-4 bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-center">
                                                <p className="text-emerald-800 font-bold text-base">Caras NUESTRAS DESPUÉS: <span className="text-2xl">{facesAfterSum}</span></p>
                                                <p className="text-xs text-emerald-600 mt-0.5">Suma automática</p>
                                            </div>
                                        </div>

                                        {/* Caras totales después */}
                                        <div className="bg-white card border border-gray-100 p-5">
                                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">📐 Anaquel después</p>
                                            <label className="block text-gray-700 text-xs font-semibold mb-1">
                                                Caras totales del anaquel <span className="text-gray-400 font-normal">(nuestras + competencia)</span>
                                            </label>
                                            <div className="flex items-center gap-3">
                                                <input type="number" min="0" placeholder="Ej: 48" value={form.totalFaces||''}
                                                    onChange={e=>setForm(p=>({...p,totalFaces:e.target.value}))}
                                                    className="w-full max-w-xs p-2.5 border border-gray-200 rounded-xl input-focus text-sm"
                                                    required={!isClienteCerrado}/>
                                                <span className="text-gray-400 text-sm">caras</span>
                                            </div>
                                        </div>
                                    </>
                                )}

                                {/* Foto DESPUÉS */}
                                <div className="bg-white card border border-gray-100 p-5">
                                    <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">📸 Fotos Después</p>
                                    <PhotoCapture label="Anaquel después de intervenir"
                                        onPhotoTaken={p=>setAfterPhotos(prev=>[...prev,p])}
                                        onRemovePhoto={i=>setAfterPhotos(prev=>prev.filter((_,j)=>j!==i))}
                                        photos={afterPhotos} isAfter={true}/>
                                </div>

                                {/* Comentarios */}
                                <div className="bg-white card border border-gray-100 p-5">
                                    <label className="block text-gray-700 text-xs font-semibold mb-1.5">
                                        Comentarios {isClienteCerrado&&<span className="text-red-500">*</span>}
                                    </label>
                                    <textarea value={comments} onChange={e=>setComments(e.target.value)}
                                        placeholder="Describe novedades, situaciones especiales..."
                                        className="w-full p-3 border border-gray-200 rounded-xl input-focus text-sm h-20 resize-none"
                                        required={isClienteCerrado}/>
                                </div>

                                {/* Submit */}
                                <button type="submit" disabled={loading||dataLoading}
                                    className="w-full btn-primary text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 disabled:opacity-50 shadow-lg text-base">
                                    {loading
                                        ? <><span className="w-5 h-5 border-2 border-white/40 border-t-white rounded-full animate-spin"></span> Guardando...</>
                                        : <><IcoSave s={20}/> Guardar visita</>
                                    }
                                </button>
                            </>
                        )}
                    </form>
                </div>

                {/* ── FAB Planograma ── */}
                {planogramImage && (
                    <>
                        <button onClick={()=>setShowPlanogram(true)}
                            className="fixed bottom-6 right-5 z-50 w-14 h-14 rounded-full bg-gradient-to-br from-indigo-600 to-purple-600 text-white shadow-xl flex items-center justify-center hover:scale-110 transition-transform active:scale-95"
                            title="Ver Planograma">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                            </svg>
                        </button>
                        {showPlanogram && (
                            <div className="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4" onClick={()=>setShowPlanogram(false)}>
                                <div className="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl" onClick={e=>e.stopPropagation()}>
                                    <div className="flex items-center justify-between p-4 border-b">
                                        <h3 className="font-bold text-indigo-700">Planograma — {linea.nombre}</h3>
                                        <button onClick={()=>setShowPlanogram(false)} className="text-2xl text-gray-500 hover:text-gray-800 leading-none">×</button>
                                    </div>
                                    <div className="overflow-auto max-h-[calc(90vh-64px)] bg-gray-100 p-3">
                                        <img src={`${supabaseUrl}/storage/v1/object/public/visits_photos/${planogramImage}`}
                                            alt="Planograma" className="w-full h-auto object-contain rounded-lg"
                                            onError={e=>{e.target.src='https://via.placeholder.com/800x600?text=Sin+planograma';}}/>
                                    </div>
                                </div>
                            </div>
                        )}
                    </>
                )}
            </div>
        );
    };

    // ════════════════════════════════════════════════
    // APP — orquesta los 4 pasos
    // ════════════════════════════════════════════════
    const App = () => {
        const [step, setStep]                 = useState(1);
        const [empresa, setEmpresa]           = useState(null);
        const [promoterId, setPromoterId]     = useState('');
        const [promoterName, setPromoterName] = useState('');
        const [initialState, setInitialState] = useState('');
        const [initialZone, setInitialZone]   = useState('');
        const [linea, setLinea]               = useState(null);

        return (
            <ErrorBoundary>
                <div className="font-sans antialiased">
                    {step===1 && (
                        <EmpresaLogin onEmpresaLogin={d=>{ setEmpresa(d); setStep(2); }}/>
                    )}
                    {step===2 && empresa && (
                        <PromotorLogin empresa={empresa}
                            onPromotorLogin={(id,name,est,zon)=>{ setPromoterId(id); setPromoterName(name); setInitialState(est); setInitialZone(zon); setStep(3); }}
                            onBack={()=>setStep(1)}/>
                    )}
                    {step===3 && empresa && (
                        <LineaSelector empresa={empresa} promoterId={promoterId} promoterName={promoterName}
                            onSelectLinea={l=>{ setLinea(l); setStep(4); }}
                            onLogout={()=>{ setStep(1); setEmpresa(null); setPromoterId(''); setPromoterName(''); setLinea(null); }}/>
                    )}
                    {step===4 && empresa && linea && (
                        <DataEntryScreen empresa={empresa} promoterName={promoterName} promoterId={promoterId}
                            linea={linea} initialState={initialState} initialZone={initialZone}
                            onLogout={()=>{ setStep(1); setEmpresa(null); setPromoterId(''); setPromoterName(''); setLinea(null); }}
                            onChangeLinea={()=>{ setLinea(null); setStep(3); }}/>
                    )}
                </div>
            </ErrorBoundary>
        );
    };

    try {
        const container = document.getElementById('root');
        if (container) createRoot(container).render(<App/>);
    } catch(e) { console.error('Render error:', e); }

    async function openDB() {
        return new Promise((res,rej)=>{
            const r = indexedDB.open('chispaDB', 2);
            r.onupgradeneeded = e=>{
                const db = e.target.result;
                if (!db.objectStoreNames.contains('pendientes'))
                    db.createObjectStore('pendientes',{keyPath:'id'});
            };
            r.onsuccess = e => res(e.target.result);
            r.onerror   = e => rej(e.target.error);
        });
    }
</script>
</body>
</html>
